# ============================================================================
# planner-shadow-anolis.yml —— P4 规划环 · 影子轨调用方（AB 对照留证）
# 2026-11-07 · D-122 清偿：从「planner.yml 整文件复制体」改为「薄调用方」
#
# 定位（铁律 4 自检面——新 agent 只凭仓内文件即可看懂「一条链两种跑法」）：
#   本件是薄调用方，不含任何规划逻辑——核心链全在
#   .github/workflows/planner-core.yml（workflow_call 可复用工作流 · 唯一正本）。
#   影子轨 = anolis-heavy 自托管 runner 上跑同一条链，DRY_RUN 硬顶 true：
#   纯观察零副作用（写步 09/09b/10 恒跳过），与生产轨 AB 对照
#   （tools/planner-ab-compare.py 配对两轨 run）。
#   重构前：本件=planner.yml 整文件复制＋四处定点改（commit 938ad57），此后
#   各自演化、分叉扩至数十处（调查环/08c/08d 只落 main；三级克隆兜底/fork
#   守卫只落影子；写步门 inputs vs env 两形态）。重构后：触发面+调用，
#   四差冻结全部收敛到 with-inputs，复制体分叉债清偿（D-122）。
#
# 行为四差冻结（P3 · 运营者批；任何一项变化先报批）：
#   ① name=planner-shadow-anolis（不变）
#   ② 触发=workflow_run(planner completed) + workflow_dispatch（撤 schedule，不变）
#   ③ runner=anolis-heavy（自托管，不变）
#   ④ DRY_RUN 硬顶 true（不变）——调用 core 恒传 dry_run: true（boolean 输入，
#     runner 侧按 on.workflow_call.inputs 类型强制转型）；本件 workflow_dispatch
#     的 dry_run 入参仅存界面兼容、不改变硬顶（与重构前 env DRY_RUN: 'true'
#     硬顶同行为：dispatch 置 false 也不会放行写入）。
#
# 已知行为微差（诚实注记，PR 体验收节同载）：重构前以 dry_run=false 手动
#   dispatch 本件时，唤醒闸 skip 可压制 plan job（当时 inputs.dry_run=='true'
#   为假、env 硬顶只管写步）；重构后硬顶恒 true ⇒ plan job 旁路 skip 照跑
#   全链留证（写步仍恒跳过、零写入）。影子轨目的=完整留证，新行为更贴合
#   目的；写入面零变化。
#
# 出网与安全（随核心链并入单源）：step 01/02 三级克隆兜底与 wake/plan 两级
#   fork 守卫均在 planner-core.yml 内（原影子轨 #112/#114 并入，两轨同源）；
#   本件调用作业另带一道 fork 守卫（与 gates.yml:147 / ci-gates-org.yml:59
#   同款惯例）——自托管 runner 不接 fork PR 头。
# ============================================================================

name: planner-shadow-anolis

on:
  workflow_run:
    workflows: [planner]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = 只规划+校验+artifact，不 commit 不建 Issue（演练）'
        required: false
        default: 'true'
      wave_number:
        description: '覆盖波次号（如 07；留空 = 现有最大波次 + 1）'
        required: false
        default: ''
      reason:
        description: '手动触发事由（进 run 摘要与 Issue 回执）'
        required: false
        default: 'manual-dispatch'

permissions:
  issues: write          # 按卡建 Issue（状态机起点 state:queued）
  contents: write        # commit wave manifest 到 factory-os（append-only）
  pull-requests: write   # 预留：P5 起自动合线腿（本工作流不开 PR、不合线）
  actions: write         # planner 自 rerun 红门/自体检（POST /actions/runs/{id}/rerun）

concurrency:             # 单写者：禁重叠跑双解（与防双解占用规则同向；与生产轨同组）
  group: planner
  cancel-in-progress: false

jobs:
  plan-core:
    name: '规划环核心链 · 调用 planner-core.yml（影子轨：anolis-heavy · dry_run 硬顶 true）'
    uses: ./.github/workflows/planner-core.yml
    # ★ A1 fork 守卫（红队 H1 收紧 · 2026-11-07 · 运营者批 A1）：
    #   委托作业以 anolis-heavy 落自托管 runner ⇒ fork PR 头不得上。本件触发面
    #   =workflow_run+workflow_dispatch，无 pull_request 面 ⇒ 本式当前恒真、
    #   行为零变化；未来新增 PR 类触发即自动生效（job 级 uses 作业允许 if；
    #   非恒假形态，不触 A-22 R19）。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    permissions:         # 调用作业显式授予全量（called workflow 不能提权）
      issues: write
      contents: write
      pull-requests: write
      actions: write
    with:
      runner: anolis-heavy
      # P3 硬顶：两触发型同顶恒零写入（重构前 env DRY_RUN: 'true' 同行为）
      dry_run: true
      wave_number: ${{ github.event.inputs.wave_number || '' }}
      reason: ${{ github.event.inputs.reason || 'cron' }}
    # 显式映射（短名 LLM/JEV/MERGE_PAT ⇐ repo secret 真身；GITHUB_TOKEN 平台自动授予）
    # 注：影子轨 dry_run 硬顶 true ⇒ 09b 恒跳过；MERGE_PAT 映射仅为两轨同源齐形
    secrets:
      LLM: ${{ secrets.LLM_API_KEY }}
      JEV: ${{ secrets.DECISION_API_KEY }}
      MERGE_PAT: ${{ secrets.PLANNER_MERGE_PAT }}

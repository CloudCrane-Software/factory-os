# =============================================================================
# gates.yml — factory-os 仓门禁接线件（内联 python 剖面；required check 上下文 = gates）
#
# 定位（出处注：建设方案《01-建设方案.md》§三「验收面」/§五 P1——org 工作区
#   30-工件/GitHub协作平面-建设方案/ 件，不在本仓；下文「建设方案 §x」均指此出处）：
#   factory-os = 工厂 OS 本体（tools/ 门禁脚本在役件 + 账本三件套 + 波次清单 +
#   制度文档）。本件是它在 GitHub Actions 侧的 PR 级反馈面，作业名恒 `gates`
#   ——分支保护把 required check `gates` 挂到这个作业名上（缺它即未验）。
#
# ★ 为什么是内联剖面而不是 uses: CloudCrane-Software/.github/.../gates.yml@main：
#   org 可复用门（.github/workflows/gates.yml）的正本是 **af 仓 F2 全量门的
#   Actions 形态**——fmt/clippy/strategies_check/test 四步全是 cargo 语义，
#   专项门点选族 {ledger,anchor,otel} 又只认 factory-os 的工具面。本仓无
#   Cargo.toml、无 crates/，套用可复用门会整链跑不动；且可复用门的专项门腿
#   依赖 anchor-check.py（出处注：org 工作区 计划/研究组/方法论批-20261031/ 件，
#   **不在本仓**）等件
#   （点选即按缺件判红）。故本仓按 §三「每个产品仓 PR 触发 gates.yml」的同一
#   目标，取内联 python 剖面（零 cargo、零外部件依赖）。af 仓走可复用门那条
#   路，见 af 仓 .github/workflows/gates.yml（CloudCrane-Software/af 正本；
#   出处注：建设期暂存树 staging/wiring/af/ 同件）。
#
# ★ 剖面三项（逐项命令正本均已实读/实跑，禁凭空编造）：
#   ① py_compile 全量 tools/（含 tools/otel/ 子目录）+ 件数下限对账
#      —— L1 同款口径（tools/all-gates.sh 头注 L1 段：全部 tools/*.py
#      py_compile；件数下限判据源 = tools/test-manifest.list 的
#      #L1_PY_COUNT_MIN 声明，all-gates.sh:644 manifest_decl 同款读法，
#      RT-E84③「删门脚本并同步改声明也红」）。下限值不写死在本件里（避免
#      第二真源），只从清单现读。
#   ② bot-scrub 树扫 —— 扫描内核**直接复用 tools/mirror-disclose.sh 内嵌
#      python 段的 scan_text() 纯函数**（18 模式 + G-13 线性内核；取法照抄
#      bot-scrub.py（出处注：org 工作区 30-工件/外派-bot-试点/tool/ 件，不在本仓）
#      的 load_scan_text()：AST 切出
#      `<<'PYEOF'`…`PYEOF` 段、只执行 scan_text/scan_g13 及其依赖闭包，不跑
#      它的 git/argparse/main 逻辑）。fail-closed：命中**或**覆盖不全
#      （二进制/非 UTF-8/单文件超预算）一律 rc=1（bot-scrub.py 2026-11-05
#      止血批口径：uncovered 非空即拒发，不得当作「扫过」）。
#      豁免面：仓内 tools/mirror-scan-allowlist.json（判据件，/tools/ 下受
#      CODEOWNERS 判官路径锁；mirror-disclose.sh load_exempt 同形同语义：
#      pattern/file/reason/expires，缺件/解析失败=空白清单 fail-closed，过期
#      自动失效）。2026-11-06 出仓闸 adjudication（判据：11-04 盘点纪律——
#      探测串/夹具/机制代码非凭据）判完 74 条全部落清单（expires 2026-12-05；
#      到期不复审即整体失效回红——时间炸弹是有意设计，逼周期复核）。**行钉**
#      （本件严于 mirror-disclose.sh）：条目带 line 时必须与命中行同号，行漂移
#      不豁免（判据漂移即红，同 gate-pins 纪律）；仅豁免清单自身因 reason 段
#      原文引用命中行所致结构性自命中，按文件级条目（不钉行）覆盖——与
#      mirror-disclose.sh 内嵌模式表自命中（17 处，同批 adjudication 逐条钉行
#      豁免）同族。未知命中（清单外）一律红，不放宽。
#   ③ 账本迁移对账门判别力自证 —— `python3 -I tools/test-ledger-migration-recon.py
#      --selftest`（该件 docstring「用法」段：--selftest = 内嵌夹具自测，零
#      网络、零真台账读取）。为什么跑 --selftest 而不是无参实跑：无参模式的
#      判据面是 逃逸问题台账.md（出处注：org 工作区 计划/研究组/红队终局轮-20261101/
#      件，**不在本仓**）等
#      的路径（该件:85-96 ESC_PATH/DEBT_PATH/DISP_PATH），在 PR 检出树上跑必
#      rc=2「不可证」——那不是门的红，是环境缺席，故门只在此验判别力（夹具
#      25 例：解析/V判/B判/前缀覆盖/豁免标记/fail-closed×2/全栏扫描/引用材料
#      归属/处置面豁免等，含 tamper 反例）。
#   ④ L2/L3 点选门（2026-11-07 卡#35/D-103 新增）—— CI L-25 前半（Q2 G-7）：
#      PR 剖面原先只含 L1+scrub+recon，all-gates.sh 的 L2–L6 门族未进 PR 面。
#      本项把 all-gates.sh **既有 L2/L3 门位**按卡点选进 PR 面：点选面 =
#      tools/gates-pr-selection.list（新件，/tools/ 下受 CODEOWNERS 判官路径锁），
#      门位真源 = tools/all-gates.sh（register_L2 glob 门位 + register_L3 add_item
#      行——**判据面零改动只接线**，卡面禁项）。三条硬语义：
#      · 按卡点选（禁全量：anolis 水位，卡面禁项「禁把 L2–L6 全量塞进 PR 门」）；
#      · **缺件显式判红**：点选门依赖件不在检出树 ⇒ 机制步 rc=2 显式红并逐条
#        点名缺失件（不可证不猜绿，禁 SKIP 冒充；点选门自退 rc=2 同口径不降级）；
#      · **A-1 SKIP 语义**：未点选门零静默——job summary 列 SKIP 清单，逐条带
#        原因（判据面在 org 工作区不在仓／按卡未点选）＋对账人（all-gates.sh
#        全量门 runner anolis-fos-01；仓内非名册门显式声明其对账人）。
#      退出码口径（对齐 all-gates.sh）：0=点选门全绿；1=点选门实跑非零；2=缺件/
#      门位不可证/点选面坏行。job 名恒 gates，既有五步零删零改。
#
# ★ 触发面纪律：仅 pull_request 且带 base 分支约束（对齐 af 仓
#   .github/workflows/f1.yml 的 R03/R04 口径；禁用 pull_request_target）。base=main
#   已实证：本仓 2026-11-06 建仓，default_branch=main（GET /repos/
#   CloudCrane-Software/factory-os 回读），分支保护 required check `gates`
#   已挂 main（strict=True + enforce_admins + code owner 审查）。
#
# ★ 零外部 action：不用 actions/checkout 等任何第三方/第一方 action（对齐
#   af 仓 ci/gh_workflow_check.py R07 与 af 仓 .github/workflows/f1.yml 的零 action
#   形态）⇒ 检出步手写 `git clone`（公开仓匿名 clone，零 token、零凭据进 argv）。
#
# ★ runner：runs-on: [anolis-heavy]（建设方案 §三：自托管 runner label
#   anolis-heavy）。2026-11-06 导入批已就位：anolis 宿主 /data/gh-runner-fos
#   （bin/externals 自 af 的 /data/gh-runner 复制，v2.338.2），repo 级注册于
#   本仓、label anolis-heavy、work=/data/gh-runner-fos-work——与 af 仓的
#   anolis-gpu-01 同宿主第二实例，互不争抢。容器作业隔离随 P2 收口（G-8 文档
#   时效订正 2026-11-06：P2 出口已过——anolis self-hosted runner 在线 +
#   label anolis-heavy + 容器作业隔离在位，判据引本仓在役契约
#   波次清单/沙箱派发契约.md「发车前前置确认」条；辅证：org 工作区
#   03-主会话交接.md 与首跑 run 42194858604 gates 真绿读数）。旧注的
#   「隔离属 P2 未竟项／P2 前仅厂内可信分支进门」为 P2 前过渡口径，就此成史。
#
# ★ 本件三项的实跑读数（2026-11-06 17:1x，出处注：建设期暂存树 staging/
#   factory-os 快照（不在本仓），含本批入库的 tools/mirror-scan-allowlist.json；
#   复跑口径 = 本件内联命令原样）：
#   ① py_compile：rc=0，「L1 在册 py 134 件（tools/ 一级 126 + 子目录 8）；
#      清单声明下限 96」→「PASS py_compile 134/134 件全过，检出树零 bytecode」。
#   ② bot-scrub：rc=0——「SCRUB: scanned=170 hits=0 exempted=150 uncovered=0
#      verdict=clean（allowlist=tools/mirror-scan-allowlist.json state=ok
#      entries=84）」。豁免 150 条 = 源码树 74（25 文件：G-13 57 / P-01 5 /
#      G-02 3 / G-12 2 / P-04 2 / P-02、G-01、G-03、G-04、G-11 各 1，全部经
#      2026-11-06 adjudication 逐条判读——探测串/夹具/机制代码非凭据，行钉，
#      expires 2026-12-05）+ 豁免清单自身结构性自命中 76（reason 段引用命中行
#      原文所致，按 10 模式族文件级条目覆盖）。
#      收口前史（同口径留档）：15:01 快照 182 命中 / 60 文件 block；16:0x
#      快照 74 命中 / 25 文件 block——出仓闸（建设方案 §五 P0 ⑤）于
#      16:58 终审 verdict=CLEAN（出处注：建设期暂存树 staging/
#      scrub-verdict-factory-os-final.json 留档，不在本仓，
#      exempted=74）收口；本件自该版起带豁免面上线，而非零豁免硬红。
#   ③ 对账判别力自证：rc=0，「selftest 25/25 过」。
# 〔2026-11-06 D-87 注释面残料清理：仓外工作区路径改写「出处注」、G-8 时效订正；
#   门集/job 名/bot-scrub 行钉/豁免清单/全部命令行零变化——diff 仅注释行〕
# 〔2026-11-07 D-103 L2/L3 点选门接线（卡#35）：新增剖面④一步 + tools/
#   gates-pr-selection.list 点选面；门位真源=tools/all-gates.sh 既有 L2/L3 门位
#   （判据面零改动只接线）；缺件显式判红 rc=2、未点选 SKIP 带原因+对账人；
#   既有五步与 job 名恒 gates 零删零改——diff 仅新增步与注释行〕
# =============================================================================
name: gates

on:
  pull_request:
    branches:
      - main

# 权限最小化：全链只读。
permissions:
  contents: read

# 并发策略：同一 PR 分支重复推送只保最新一次验收。
concurrency:
  group: gates-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # 作业名恒 `gates`——分支保护 required check 以作业名粒度挂载（§五 P1）。
  gates:
    runs-on: [anolis-heavy]
    timeout-minutes: 45
    # ★ A1 fork 守卫（红队 H1 收紧 · 2026-11-07 · 运营者批 A1）：
    #   自托管 runner（anolis-heavy）不得执行未批 fork PR 的 PR 树代码。
    #   · 非 pull_request 事件 ⇒ 原样放行（本件现触发面只有 pull_request；
    #     未来若加 push/schedule/dispatch 等触发不受影响）；
    #   · pull_request 事件 ⇒ 仅放行同仓分支头（head.repo.fork == false）；
    #     fork 头整 job 跳过（check 报 skipped——不判红、不拦合流）。
    #   双保险：仓级设置 fork-pr-contributor-approval=all_external_contributors
    #   （设置腿）先拦于 workflow 触发前，本守卫腿兜底于 job 调度层。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - name: 分工声明（factory-os 判官面 PR 级反馈：语法/脱敏/对账判别力）
        run: |
          echo "gates.yml（factory-os）：L1 py_compile 全量 tools/ + bot-scrub 树扫 + 账本迁移对账门判别力自证"
          echo "runner label: anolis-heavy（自托管）｜容器作业隔离：P2 留待项"
          # 注（D-87 G-8 时效订正）：上行 echo 属在役读数面（命令行禁改），其
          # 「P2 留待项」字样已成史——容器作业隔离随 P2 收口，见头注订正条。

      - name: 检出 PR 头树（零外部 action：手写 git clone；公开仓匿名即可）
        env:
          AF_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AF_HEAD_CLONE_URL: ${{ github.event.pull_request.head.repo.clone_url }}
        run: |
          set -eu
          set -o pipefail
          REF="${AF_HEAD_REF:-${GITHUB_HEAD_REF:-}}"
          if [ -z "$REF" ]; then
            echo "取不到 PR 头分支（事件上下文缺 pull_request.head.ref）" >&2
            exit 1
          fi
          # PR 头可能在 fork 上 ⇒ 优先用 head.repo.clone_url，缺席回落本仓地址。
          # 本仓公开（建设方案 §一：全公开）⇒ 匿名 clone，零凭据落盘、
          # 零凭据进 argv。若将来改私有，本步须改用 GITHUB_TOKEN 且不得打印。
          URL="${AF_HEAD_CLONE_URL:-}"
          [ -n "$URL" ] || URL="https://github.com/${GITHUB_REPOSITORY}.git"
          SRC="src"
          rm -rf "$SRC"
          # ★ 三级兜底链（2026-11-06 卡#43；只动本步，门语义零改动）：
          #   L1 github.com 直连 clone（现状原样）失败 → L2 经代理 clone →
          #   L3 codeload tarball 解包（树与 clone 等价——后续门全为文件面
          #   检查，不依赖 .git）。每级失败留日志痕迹；三级皆败 fail-closed
          #   判红，不吞红、不放宽。
          VIA=""
          if git clone --depth 1 --branch "$REF" "$URL" "$SRC"; then
            VIA="L1-git-clone-direct"
          else
            echo "[fallback] L1 github.com 直连 clone 失败——转 L2 代理 clone" >&2
            PROXY="${https_proxy:-${HTTPS_PROXY:-${http_proxy:-${HTTP_PROXY:-}}}}"
            if [ -n "$PROXY" ]; then
              attempt=0
              until [ "$attempt" -ge 3 ]; do
                rm -rf "$SRC"
                if git -c http.proxy="$PROXY" clone --depth 1 --branch "$REF" "$URL" "$SRC"; then
                  VIA="L2-git-clone-proxy"
                  break
                fi
                attempt=$((attempt + 1))
                echo "[fallback] L2 代理 clone 失败（第 $attempt/3 次）——5s 后重试" >&2
                sleep 5
              done
            else
              echo "[fallback] L2 无代理变量可取（runner env 缺 http(s)_proxy）——跳过转 L3" >&2
            fi
          fi
          if [ -z "$VIA" ]; then
            echo "[fallback] L2 代理 clone 不可用/均失败——转 L3 codeload tarball" >&2
            ORGREPO="${URL#https://github.com/}"
            ORGREPO="${ORGREPO%.git}"
            TARURL="https://codeload.github.com/${ORGREPO}/tar.gz/refs/heads/${REF}"
            attempt=0
            until [ "$attempt" -ge 3 ]; do
              rm -rf "$SRC" && mkdir -p "$SRC"
              # --noproxy '*'：L3 刻意直连 codeload（第三条路由），不受 L2
              # 同源代理变量牵连——代理死时 tarball 路仍活（卡#43 实测形态）。
              if curl -fsSL --noproxy '*' --connect-timeout 15 --max-time 300 "$TARURL" | tar -xz -C "$SRC" --strip-components=1; then
                VIA="L3-codeload-tarball"
                break
              fi
              attempt=$((attempt + 1))
              echo "[fallback] L3 codeload tarball 失败（第 $attempt/3 次）——5s 后重试" >&2
              sleep 5
            done
          fi
          if [ -z "$VIA" ]; then
            echo "[fallback] 三级皆失败（直连 clone/代理 clone/codeload tarball）——fail-closed 判红" >&2
            exit 1
          fi
          cd "$SRC"
          if [ -d .git ]; then
            git --no-pager log --oneline -1
          else
            echo "（L3 tarball 检出无 .git——文件面等价，跳过 git log）"
          fi
          echo "检出 PR 头树：ref=$REF url=$URL 期望 head.sha=${AF_HEAD_SHA:-未提供}｜经=$VIA"

      # ---- 剖面①：py_compile 全量 tools/（含子目录）+ 件数下限对账 ----------
      - name: L1 · py_compile 全量 tools/（含子目录）+ 件数下限对账（内联 python）
        run: |
          set -eu
          cd src
          python3 -I - <<'PY'
          import os
          import pathlib
          import py_compile
          import re
          import sys
          import tempfile

          sys.dont_write_bytecode = True   # 不在检出树留 __pycache__
          root = pathlib.Path("tools")
          if not root.is_dir():
              sys.exit("FAIL tools/ 不在位——判官路径整族缺席（摘门保牌形态，判红）")

          files = sorted(p for p in root.rglob("*.py")
                         if p.is_file() and "__pycache__" not in p.parts)
          top = sum(1 for p in files if p.parent == root)
          sub = len(files) - top

          # 件数下限判据源 = tools/test-manifest.list 的 #L1_PY_COUNT_MIN 声明
          # （all-gates.sh:644 manifest_decl L1_PY_COUNT_MIN 同款读法；RT-E84③：
          #  删门脚本并同步改清单声明也红——故下限只从清单现读，不在本件写死）
          mf = root / "test-manifest.list"
          if not mf.is_file():
              sys.exit("FAIL tools/test-manifest.list 不在位——L1 件数下限无从对账")
          floor = None
          for ln in mf.read_text(encoding="utf-8").splitlines():
              m = re.match(r"^#L1_PY_COUNT_MIN=(\d+)\s*$", ln.strip())
              if m:
                  floor = int(m.group(1))
          if floor is None:
              sys.exit("FAIL tools/test-manifest.list 缺 #L1_PY_COUNT_MIN 声明"
                       "——件数下限不可解析（钉值不可读 ⇒ 门无从对账 ⇒ 红）")

          print("L1 在册 py %d 件（tools/ 一级 %d + 子目录 %d）；清单声明下限 %d"
                % (len(files), top, sub, floor))
          if len(files) < floor:
              sys.exit("FAIL 在册 py %d < 下限 %d——有门脚本被摘除（删件并同步改"
                       "清单声明也红，RT-E84③）" % (len(files), floor))

          # cfile 指到临时目录：编译产物不进检出树（不脏 PR 工作区、不留 bytecode）
          tmp = tempfile.mkdtemp(prefix="factory-os-pycompile-")
          bad = []
          for i, p in enumerate(files):
              try:
                  py_compile.compile(str(p), cfile=os.path.join(tmp, "%05d.pyc" % i),
                                     doraise=True)
              except py_compile.PyCompileError as exc:
                  bad.append("%s: %s" % (p, str(exc).strip().splitlines()[-1]))
              except Exception as exc:            # 不可证不猜绿
                  bad.append("%s: %s: %s" % (p, type(exc).__name__, exc))
          if bad:
              for b in bad:
                  print("  [FAIL] %s" % b)
              sys.exit("FAIL py_compile %d/%d 件红" % (len(bad), len(files)))
          print("PASS py_compile %d/%d 件全过（cfile 落 %s，检出树零 bytecode）"
                % (len(files), len(files), tmp))
          PY

      # ---- 剖面②：bot-scrub 树扫（scan_text 内核 + 仓内 adjudication 豁免）-----
      - name: bot-scrub 树扫（fail-closed：未豁免命中或覆盖不全即红；内联 python）
        run: |
          set -eu
          cd src
          python3 -I - <<'PY'
          import ast
          import json
          import os
          import re
          import sys
          import time

          # 扫描内核 = tools/mirror-disclose.sh 内嵌 python 段的 scan_text() 纯函数。
          # 取法照抄 bot-scrub.py 的 load_scan_text()（出处注：org 工作区件，
          # 30-工件/外派-bot-试点/tool/，不在本仓）：
          #   切出 `<<'PYEOF'`…`PYEOF` 段 → ast 解析 → 只执行 scan_text/scan_g13
          #   及其依赖闭包（COMPILED/G13_* 常量）→ 不跑它的 git/argparse/main 逻辑。
          MIRROR = os.path.join("tools", "mirror-disclose.sh")
          if not os.path.isfile(MIRROR):
              sys.exit("FAIL %s 不在位——bot-scrub 扫描内核缺席（不可证不猜绿）" % MIRROR)

          lines = open(MIRROR, "r", encoding="utf-8").readlines()
          try:
              start = next(i for i, l in enumerate(lines) if "<<'PYEOF'" in l)
              end = next(i for i, l in enumerate(lines) if i > start and l.strip() == "PYEOF")
          except StopIteration:
              sys.exit("FAIL %s 里找不到内嵌 python 段（PYEOF）" % MIRROR)
          src = "".join(lines[start + 1:end])
          tree = ast.parse(src, filename=MIRROR + "#embedded")

          wanted = {"scan_text", "scan_g13"}
          defs, assigns = {}, {}
          for node in tree.body:
              if isinstance(node, ast.FunctionDef):
                  defs[node.name] = node
              elif isinstance(node, ast.Assign):
                  for t in node.targets:
                      if isinstance(t, ast.Name):
                          assigns.setdefault(t.id, node)
              elif isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                  assigns.setdefault(node.target.id, node)

          BUILTINS = {"re", "bisect", "os", "sys", "json", "str", "len", "sorted",
                      "set", "bytes", "int", "min", "max", "range", "sum", "open",
                      "print", "enumerate", "isinstance", "dict", "list", "tuple",
                      "any", "all", "zip", "map", "filter", "abs", "repr", "format",
                      "True", "False", "None", "Exception", "ValueError", "TypeError"}

          def load_names(node):
              return {x.id for x in ast.walk(node)
                      if isinstance(x, ast.Name) and isinstance(x.ctx, ast.Load)}

          selected, frontier = set(), set(wanted)
          while frontier:
              name = frontier.pop()
              if name in selected:
                  continue
              selected.add(name)
              node = defs.get(name) or assigns.get(name)
              if node is None:
                  continue
              for g in load_names(node):
                  if g not in selected and g not in BUILTINS and (g in defs or g in assigns):
                      frontier.add(g)

          order = {}
          for i, node in enumerate(tree.body):
              if isinstance(node, ast.FunctionDef):
                  order.setdefault(node.name, i)
              elif isinstance(node, ast.Assign):
                  for t in node.targets:
                      if isinstance(t, ast.Name):
                          order.setdefault(t.id, i)
                          break
              elif isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                  order.setdefault(node.target.id, i)
          body = [defs.get(n) or assigns.get(n) for n in sorted(selected, key=lambda n: order.get(n, 10 ** 6))]
          body = [b for b in body if b is not None]
          ns = {"re": re, "bisect": __import__("bisect"), "os": os, "sys": sys}
          exec(compile(ast.Module(body=body, type_ignores=[]), MIRROR, "exec"), ns)
          if "scan_text" not in ns:
              sys.exit("FAIL %s 内嵌段里找不到 scan_text" % MIRROR)
          scan_text = ns["scan_text"]
          npat = len(ns.get("COMPILED", []))

          # ---- 豁免清单：tools/mirror-scan-allowlist.json（判据件，/tools/ 下受
          #      CODEOWNERS 判官路径锁）。语义照抄 mirror-disclose.sh load_exempt：
          #      pattern/file/reason/expires 四键缺一不认；缺件或解析失败 = 空白
          #      清单（fail-closed——有命中即红）；expires 早于当天自动失效。
          #      行钉（本件严于 mirror-disclose.sh）：条目带 line 时必须与命中行
          #      同号——行漂移不豁免 ⇒ 源码一改逼重新 adjudication（判据漂移即红）。
          #      文件级条目（不带 line）仅覆盖清单自身：专治本清单 reason 段原文
          #      引用命中行所致的结构性自命中（同 mirror-disclose.sh 模式表族）。
          ALLOW = os.path.join("tools", "mirror-scan-allowlist.json")
          al_state, exempt = "missing", []
          if os.path.isfile(ALLOW):
              try:
                  data = json.load(open(ALLOW, encoding="utf-8"))
                  al_state = "ok"
              except Exception:
                  al_state, data = "parse-fail", []
              today = time.strftime("%Y-%m-%d")
              for e in (data if isinstance(data, list) else []):
                  if not isinstance(e, dict):
                      continue
                  if not e.get("pattern") or not e.get("file") or not e.get("reason"):
                      continue
                  if str(e.get("expires", "")) < today:
                      continue
                  exempt.append(e)

          def hit_exempt(pid, rel, ln):
              base = os.path.basename(rel)
              for e in exempt:
                  if e["pattern"] != pid:
                      continue
                  if e["file"] not in (rel, "*", base):
                      continue
                  el = e.get("line")
                  if el is not None and int(el) != ln:
                      continue
                  return True
              return False

          # 树扫（照抄 bot-scrub.py 的 scan()：逐文件预算 + 二进制/非 UTF-8 登记
          #   为未覆盖，不静默跳过、不装作扫过）
          TREE = "."
          PER_FILE_BUDGET_S = 30.0
          MAX_FILE_BYTES = 64 * 1024 * 1024
          hits, exempted, scanned, uncovered = [], [], 0, []
          for dirpath, dirnames, filenames in os.walk(TREE):
              dirnames[:] = [d for d in dirnames if d != ".git"]
              for fn in sorted(filenames):
                  p = os.path.join(dirpath, fn)
                  rel = os.path.relpath(p, TREE)
                  try:
                      size = os.path.getsize(p)
                      if size > MAX_FILE_BYTES:
                          uncovered.append({"file": rel, "reason": "oversize"})
                          continue
                      raw = open(p, "rb").read()
                  except Exception as exc:
                      hits.append({"file": rel, "pattern": "READ-FAIL", "ctx": str(exc)[:120]})
                      continue
                  scanned += 1
                  if b"\x00" in raw[:8192]:
                      uncovered.append({"file": rel, "reason": "binary"})
                      continue
                  try:
                      txt = raw.decode("utf-8")
                  except Exception:
                      uncovered.append({"file": rel, "reason": "non-utf8"})
                      continue
                  t0 = time.time()
                  try:
                      recs = scan_text(txt)
                  except Exception as exc:
                      hits.append({"file": rel, "pattern": "SCAN-ERROR", "ctx": str(exc)[:120]})
                      continue
                  if time.time() - t0 > PER_FILE_BUDGET_S:
                      hits.append({"file": rel, "pattern": "BUDGET-EXCEEDED"})
                      continue
                  for pid, ln in recs:
                      if hit_exempt(pid, rel, ln):
                          exempted.append({"file": rel, "pattern": pid, "line": ln})
                      else:
                          hits.append({"file": rel, "pattern": pid, "line": ln})

          reasons = []
          if hits:
              reasons.append("hits")
          if uncovered:
              reasons.append("uncovered")
          verdict = "block" if reasons else "clean"
          rep = {"schema": "af.bot.scrub.v1", "tree": os.path.abspath(TREE),
                 "scanner": MIRROR,
                 "scanner_mode": "scan_text() 复用（18 模式 + G-13 线性内核）",
                 "pattern_count": npat, "scanned_files": scanned,
                 "allowlist": ALLOW, "allowlist_state": al_state,
                 "allowlist_entries": len(exempt),
                 "hits": hits, "exempted": exempted, "exempt_list": ALLOW,
                 "uncovered": uncovered, "verdict": verdict, "block_reasons": reasons}
          with open(os.environ.get("BOT_SCRUB_OUT", "bot-scrub-report.json"), "w",
                    encoding="utf-8") as f:
              f.write(json.dumps(rep, ensure_ascii=False, indent=2) + "\n")
          print("SCRUB: scanned=%d hits=%d exempted=%d uncovered=%d verdict=%s "
                "(allowlist=%s state=%s entries=%d)"
                % (scanned, len(hits), len(exempted), len(uncovered), verdict,
                   ALLOW, al_state, len(exempt)))
          for h in hits[:25]:
              print("  HIT %s:%s [%s]" % (h.get("file"), h.get("line", "?"), h.get("pattern")))
          for u in uncovered[:25]:
              print("  UNCOVERED %s (%s)" % (u["file"], u["reason"]))
          if reasons:
              sys.exit("FAIL bot-scrub verdict=block（%s）——出仓闸 fail-closed："
                       "未豁免命中或覆盖不全一律拒" % ",".join(reasons))
          print("PASS bot-scrub 零未豁免命中零未覆盖（豁免 %d 条，明细见报告 "
                "exempted 段）" % len(exempted))
          PY

      # ---- 剖面③：账本迁移对账门判别力自证 --------------------------------
      - name: 对账检查 · 账本迁移对账门判别力自证（tools/test-ledger-migration-recon.py --selftest）
        run: |
          set -eu
          cd src
          # 命令正本：tools/test-ledger-migration-recon.py docstring「用法」段
          #   （--selftest = 内嵌夹具自测，零网络、零真台账读取）。
          # 为什么不跑无参实跑：无参判据面（出处注：org 工作区 计划/研究组/
          # 红队终局轮-20261101/
          #   逃逸问题台账.md 等）不在本仓 ⇒ PR 检出树上必 rc=2「不可证」，
          #   那是环境缺席不是门的红。PR 面验的是判别力仍在（夹具含 tamper 反例）。
          python3 -I tools/test-ledger-migration-recon.py --selftest

      # ---- 剖面④（D-103）：L2/L3 点选门（all-gates 既有门位·缺件显式红·SKIP 带原因对账人）
      - name: L2/L3 点选门（tools/gates-pr-selection.list 驱动；缺件 rc=2 显式红；未点选 SKIP+原因+对账人）
        run: |
          set -eu
          set -o pipefail
          cd src
          # 机制内核（内联 python，与本地实跑同源同款）：
          #   门位真源 = tools/all-gates.sh（register_L2 glob 门位 + register_L3 add_item
          #     行——判据面零改动，只接线）；点选面 = tools/gates-pr-selection.list（新件，
          #     /tools/ 下受 CODEOWNERS 判官路径锁）。
          #   rc 语义（对齐 all-gates.sh 退出码口径）：0=点选门全绿；1=点选门实跑非零；
          #     2=缺件/门位不可证/点选面坏行（含点选门自退 rc=2）——「不可证」≠「绿」。
          python3 -I - <<'PY'
          import glob
          import json
          import os
          import re
          import subprocess
          import sys

          TOOLS = "tools"
          ALLGATES = os.path.join(TOOLS, "all-gates.sh")
          SELFILE = os.path.join(TOOLS, "gates-pr-selection.list")
          REPORT = "gates-selection-report.json"
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY")
          SEL_TIMEOUT = int(os.environ.get("AF_SEL_TIMEOUT", "900"))

          ACCOUNTANT_ALLGATES = (
              "tools/all-gates.sh 全量门（L2/L3 常驻项；anolis 自托管 runner anolis-fos-01 "
              "定时/人工全量跑——本 PR 剖面按卡点选，不全量）")

          RED2_KINDS = {"缺件显式红 rc=2", "门位解析失败", "族列非法", "点选行坏行", "SKIP 行坏行",
                        "点选面缺件", "SKIP/点选矛盾", "实跑不可证 rc=2"}


          def out(msg=""):
              print(msg, flush=True)


          # ---- 1. all-gates.sh 既有门位解析 ------------------------------------------
          def join_continuations(text):
              joined, buf = [], ""
              for ln in text.splitlines():
                  buf = (buf + " " + ln.strip()) if buf else ln
                  if buf.rstrip().endswith("\\"):
                      buf = buf.rstrip()[:-1]
                      continue
                  joined.append(buf)
                  buf = ""
              if buf.strip():
                  joined.append(buf)
              return joined


          ag_text = open(ALLGATES, encoding="utf-8").read()
          ag_lines = join_continuations(ag_text)

          l2_template, l3_pos = None, {}
          for ln in ag_lines:
              m = re.match(r'\s*add_item\s+L2\s+"([^"]*)"\s+"([^"]*)"\s+"([^"]*)"\s*$', ln)
              if m:
                  l2_template = m.group(3)          # "python3 '$f'"（all-gates.sh:757）
                  continue
              m = re.match(r'\s*add_item\s+L3\s+"([^"]+)"\s+\d+\s+"(.*)"\s*$', ln)
              if m:
                  l3_pos[m.group(1)] = m.group(2)

          l2_names = sorted(os.path.basename(p) for p in glob.glob(os.path.join(TOOLS, "test-*.py")))

          if not os.path.isfile(ALLGATES):
              out("RED rc=2：%s 不在位——门位真源缺席（不可证不猜绿）" % ALLGATES)
              sys.exit(2)
          if l2_template is None:
              out("RED rc=2：all-gates.sh 解析不到 register_L2 的 add_item 命令模板"
                  "（all-gates.sh:757 同款）——L2 门位真源不可读")
              sys.exit(2)
          if not l3_pos:
              out("RED rc=2：all-gates.sh 解析不到 register_L3 的 add_item 行——L3 门位真源不可读")
              sys.exit(2)


          def expand(cmd):
              return cmd.replace("$TOOLS", TOOLS).replace("$WS", ".")


          def ws_deps(cmd):
              """命令模板里引用的 $WS/$TOOLS 相对路径（SKIP 原因判据用）。

              返回 (存在性检查路径, 展示路径)：$WS→仓根、$TOOLS→tools/，两族不同根。
              """
              found = []
              for m in re.finditer(r"\$(WS|TOOLS)/([^\s'\";&|)]+)", cmd):
                  root = "." if m.group(1) == "WS" else TOOLS
                  found.append((os.path.join(root, m.group(2)),
                                ("%s/%s" % (root, m.group(2))).replace("./", "")))
              return found


          # ---- 2. 读点选面 ------------------------------------------------------------
          if not os.path.isfile(SELFILE):
              out("RED rc=2：%s 不在位——点选面缺席（不可证不猜绿）" % SELFILE)
              sys.exit(2)

          sel, skip_decl, bad_lines = [], [], []
          for raw in open(SELFILE, encoding="utf-8"):
              ln = raw.rstrip("\n")
              if not ln.strip() or ln.lstrip().startswith("#"):
                  continue
              parts = ln.split("\t")
              if parts[0].strip() == "SKIP":
                  if len(parts) < 4 or not parts[1].strip():
                      bad_lines.append(("SKIP 行坏行", ln, "SKIP 行须 4 列：SKIP/门名/原因/对账人"))
                  else:
                      skip_decl.append((parts[1].strip(), parts[2].strip(), parts[3].strip()))
                  continue
              if len(parts) < 5 or not parts[0].strip():
                  bad_lines.append(("点选行坏行", ln, "点选行须 5 列：门名/族/命令/依赖件/备注"))
                  continue
              sel.append({"name": parts[0].strip(), "family": parts[1].strip(),
                          "cmd": parts[2].strip(), "deps": parts[3].strip(),
                          "note": parts[4].strip()})

          # ---- 3. 点选门逐件：门位解析 → 依赖件对账 → 实跑 -----------------------------
          runs, reds = [], list(bad_lines)
          selected_names = set()
          for e in sel:
              name, fam = e["name"], e["family"]
              if name in selected_names:
                  reds.append(("点选面重复", name, "同名门在点选面重复出现——点选须唯一"))
                  continue
              selected_names.add(name)

              if fam == "L2":
                  if name not in l2_names:
                      reds.append(("门位解析失败", name,
                                   "register_L2 glob 名册（%d 件）无此件——点选名与既有门位不符"
                                   % len(l2_names)))
                      continue
                  cmd = expand(l2_template.replace("$f", os.path.join(TOOLS, name))
                               .replace("$base", name))
              elif fam == "L3":
                  if name not in l3_pos:
                      reds.append(("门位解析失败", name,
                                   "register_L3 add_item 名册（%d 件）无此门名——点选名与既有门位不符"
                                   % len(l3_pos)))
                      continue
                  cmd = expand(l3_pos[name])
              elif fam in ("L2X", "L3X"):
                  if e["cmd"] in ("", "-"):
                      reds.append(("门位解析失败", name,
                                   "%s 族须在命令列显式给出命令（门位在 all-gates.sh 名册之外）" % fam))
                      continue
                  cmd = e["cmd"]
              else:
                  reds.append(("族列非法", name, "族须为 L2/L3/L2X/L3X，读到 %r" % fam))
                  continue

              deps = [d.strip() for d in e["deps"].split(",") if d.strip()]
              missing = [d for d in deps if not os.path.exists(d)]
              if missing:
                  reds.append(("缺件显式红 rc=2", name,
                               "点选门依赖件不在检出树：%s——不可证不猜绿（禁 SKIP 冒充）"
                               % "; ".join(missing)))
                  continue
              if not deps:
                  reds.append(("点选面缺件", name, "点选行未声明任何依赖件——判据面不可对账即不可证"))
                  continue

              out("[RUN %s·%s] %s" % (fam, name, cmd))
              try:
                  p = subprocess.run(cmd, shell=True, cwd=".", capture_output=True,
                                     text=True, timeout=SEL_TIMEOUT)
                  rc, text = p.returncode, (p.stdout or "") + (p.stderr or "")
              except subprocess.TimeoutExpired:
                  reds.append(("实跑超时", name, "超过 %ds 预算（all-gates.sh 口径：超时即红）"
                               % SEL_TIMEOUT))
                  continue
              tail = "\n".join([l for l in text.splitlines() if l.strip()][-6:])
              if rc == 0:
                  runs.append({"name": name, "family": fam, "rc": 0, "verdict": "PASS",
                               "cmd": cmd, "tail": tail})
                  out("[PASS %s·%s] rc=0 ｜ %s" % (fam, name, tail.replace("\n", " ⏎ ")))
              elif rc == 2:
                  # 门自退 rc=2 = 不可证（all-gates.sh 退出码语义）——机制层同口径判红 rc=2，
                  # 不降级成 rc=1（「不可证」≠「绿」取证）。
                  kind = "实跑不可证 rc=2"
                  reds.append((kind, name, tail.replace("\n", " ⏎ ")))
                  runs.append({"name": name, "family": fam, "rc": rc, "verdict": "FAIL",
                               "cmd": cmd, "tail": tail})
                  out("[RED %s·%s] 门自退 rc=2（不可证）｜ %s" % (fam, name, tail.replace("\n", " ⏎ ")))
              else:
                  reds.append(("实跑红 rc=%d" % rc, name, tail.replace("\n", " ⏎ ")))
                  runs.append({"name": name, "family": fam, "rc": rc, "verdict": "FAIL",
                               "cmd": cmd, "tail": tail})
                  out("[RED %s·%s] rc=%d ｜ %s" % (fam, name, rc, tail.replace("\n", " ⏎ ")))

          # ---- 4. SKIP 面（A-1：未点选门零静默，逐条原因+对账人）----------------------
          skips = []
          for name in l2_names:
              if name in selected_names:
                  continue
              body = open(os.path.join(TOOLS, name), encoding="utf-8", errors="replace").read()
              extra = ""
              if re.search(r'expanduser\("~|"/home/|~/workspace', body):
                  extra = ("；另注：本门判据面硬编码 org 工作区路径，PR 检出树跑之将离树判读"
                           "（更不应点选）")
              skips.append((name, "未点选（卡 D-103 按卡点选制：L2/L3 族门不全量进 PR 门——anolis "
                                  "水位）；门件在仓%s" % extra, ACCOUNTANT_ALLGATES))
          for name, tmpl in sorted(l3_pos.items()):
              if name in selected_names:
                  continue
              absent = [disp for chk, disp in ws_deps(tmpl) if not os.path.exists(chk)]
              if absent:
                  reason = ("判据面在 org 工作区（%s 不在 factory-os 仓）⇒ PR 检出树不可证——按卡 "
                            "不点选（点选即 rc=2 缺件显式红）" % "; ".join(absent))
              else:
                  reason = "未点选（卡 D-103 按卡点选制：L2/L3 族门不全量进 PR 门——anolis 水位）"
              skips.append((name, reason, ACCOUNTANT_ALLGATES))
          for name, reason, acct in skip_decl:
              if name in selected_names:
                  reds.append(("SKIP/点选矛盾", name, "同名门既点选又声明 SKIP——点选面自相矛盾"))
              else:
                  skips.append((name, reason, acct))

          # ---- 5. 摘要（stdout + job summary + 机读报告）------------------------------
          has_red2 = any(k in RED2_KINDS for k, _n, _d in reds)
          final_rc = 2 if has_red2 else (1 if reds else 0)

          out("")
          out("=== D-103 点选门摘要（门位真源=tools/all-gates.sh；点选面=%s）===" % SELFILE)
          out("既有门位名册：L2 glob %d 件 + L3 add_item %d 件；点选 %d 件（L2 %d / L3 %d / X 族 %d）；"
              "SKIP %d 件" % (len(l2_names), len(l3_pos), len(sel),
                              sum(1 for e in sel if e["family"] == "L2"),
                              sum(1 for e in sel if e["family"] == "L3"),
                              sum(1 for e in sel if e["family"].endswith("X")),
                              len(skips)))
          for r in runs:
              out("  [%s] %s·%s rc=%d" % (r["verdict"], r["family"], r["name"], r["rc"]))
          for kind, name, detail in reds:
              out("  [RED·%s] %s ｜ %s" % (kind, name, detail))
          out("  —— SKIP 清单（A-1：逐条原因+对账人）——")
          for name, reason, acct in skips:
              out("  SKIP %s ｜ 原因：%s ｜ 对账人：%s" % (name, reason, acct))
          out("结论：rc=%d（%s）" % (final_rc,
                                   "全绿" if final_rc == 0 else
                                   ("有红（含缺件/不可证 rc=2 类）" if final_rc == 2 else "有红（实跑非零）")))

          lines = ["### D-103 点选门摘要（L2/L3 族门·按卡点选·缺件显式红·SKIP 带原因对账人）", "",
                   "- 门位真源：`tools/all-gates.sh`（register_L2 glob 名册 %d 件 + register_L3 "
                   "add_item 名册 %d 件）；点选面：`%s`" % (len(l2_names), len(l3_pos), SELFILE),
                   "- 点选 %d 件；SKIP %d 件；结论 **rc=%d**" % (len(sel), len(skips), final_rc), "",
                   "| 点选门 | 族 | rc | 判定 |", "| --- | --- | --- | --- |"]
          for r in runs:
              lines.append("| %s | %s | %d | %s |" % (r["name"], r["family"], r["rc"], r["verdict"]))
          for kind, name, detail in reds:
              lines.append("| %s | — | — | RED·%s：%s |" % (name, kind, detail.replace("|", "\\|")[:400]))
          lines += ["", "#### SKIP 清单（A-1：每条带原因+对账人）", "",
                    "| 门 | 原因 | 对账人 |", "| --- | --- | --- |"]
          for name, reason, acct in skips:
              lines.append("| %s | %s | %s |" % (name, reason.replace("|", "\\|"), acct))
          if SUMMARY:
              with open(SUMMARY, "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")

          with open(REPORT, "w", encoding="utf-8") as f:
              json.dump({"schema": "af.fos.gates-selection.v1", "card": "D-103",
                         "roster": {"l2_glob": l2_names, "l3_add_item": sorted(l3_pos)},
                         "selected": sel, "runs": runs,
                         "reds": [{"kind": k, "name": n, "detail": d} for k, n, d in reds],
                         "skips": [{"name": n, "reason": r, "accountant": a}
                                   for n, r, a in skips],
                         "final_rc": final_rc}, f, ensure_ascii=False, indent=2)
          out("（机读报告：%s；job summary 已写：%s）" % (REPORT, bool(SUMMARY)))

          sys.exit(final_rc)
          PY

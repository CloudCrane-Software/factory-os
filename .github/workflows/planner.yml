# ============================================================================
# planner.yml —— P4 规划环 · 生产轨调用方（schedule + workflow_dispatch）
# 2026-11-07 · D-122 影子轨复制体分叉清偿（workflow_call 单源双用 · factory-os#134）
#
# 定位（铁律 4 自检面——新 agent 只凭仓内文件即可看懂「一条链两种跑法」）：
#   本件是薄调用方，不含任何规划逻辑——核心链全在
#   .github/workflows/planner-core.yml（workflow_call 可复用工作流 · 唯一正本，
#   头注载完整架构说明与 P4 部署/模型配额口径）。一条链两种跑法：
#     ① 生产轨 = 本件：schedule '*/10 * * * *' + workflow_dispatch
#        → 调 planner-core：runner=ubuntu-latest（GitHub 托管）、
#          dry_run=演练值（schedule 恒 false；dispatch 可置 true）
#     ② 影子轨 = planner-shadow-anolis.yml：workflow_run(planner completed)
#        + workflow_dispatch → 调同一 planner-core：runner=anolis-heavy
#        （自托管）、dry_run=true 硬顶（纯观察零副作用，写步恒跳过）
#   ⇒ 母本逻辑只此一处：改 planner-core 即两轨同改，「改母本必须人肉同步
#     影子」的口口相传纪律退役（D-122 清偿；影子四差冻结不变，差异全部收敛
#     到调用方的 with-inputs）。
#   重构前本件=核心链全文（3712 行，与影子轨整文件复制分叉）；重构后=触发面
#   +调用，行为等价（逐 step 字节对账见 D-122 PR 体验收节）。
#
# 调用纪律（workflow_call 语法约束与安全不变量）：
#   · with 值只许 github/needs 上下文 ⇒ dispatch 入参经 github.event.inputs.*
#     读取；string→boolean 显式比较落地（schedule 事件无 inputs ⇒ 恒 false）。
#   · 调用作业显式授予 permissions 全量——called workflow 的 GITHUB_TOKEN
#     只能下调不能上调，且调用作业不声明权限时被调件只拿到 repo 默认权限
#     （可能只读）⇒ 显式授予防静默降权（issues/contents/pull-requests/actions）。
#   · secrets 显式映射两键（LLM/JEV，与核心链 on.workflow_call.secrets 同形
#     声明）——真身 = repo secret LLM_API_KEY / DECISION_API_KEY；
#     GITHUB_TOKEN 由平台自动授予被调工作流，不经映射。不用 inherit 全量继承：
#     显式契约更紧（调用方只披露核心链声明的两键），且短名声明形态可过仓内
#     bot-scrub G-13（凭据赋值对形态）树扫——判据面零改动前提下的落地形。
#   · concurrency 单写者（group: planner）随本件声明——触发策略属调用方面，
#     非链逻辑；called workflow 的作业随调用方 run 承载（两轨同组=互斥不改）。
# ============================================================================

name: planner

on:
  schedule:
    # 每 10 分钟轻唤醒：由核心链 job wake（唤醒闸）先判值不值得烧贵腿；
    # 提频换响应性，GLM 调用稳态仍被 03b 配额闸钉在 ≤4 次/h（2026-11-07 运营者授权 2→4）
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = 只规划+校验+artifact，不 commit 不建 Issue（演练）'
        required: false
        default: 'false'
      wave_number:
        description: '覆盖波次号（如 07；留空 = 现有最大波次 + 1）'
        required: false
        default: ''
      reason:
        description: '手动触发事由（进 run 摘要与 Issue 回执）'
        required: false
        default: 'manual-dispatch'

permissions:
  issues: write          # 按卡建 Issue（状态机起点 state:queued）
  contents: write        # commit wave manifest 到 factory-os（append-only）
  pull-requests: write   # 预留：P5 起自动合线腿（本工作流不开 PR、不合线）
  actions: write         # planner 自 rerun 红门/自体检（POST /actions/runs/{id}/rerun）

concurrency:             # 单写者：禁重叠跑双解（与防双解占用规则同向）
  group: planner
  cancel-in-progress: false

jobs:
  plan-core:
    name: '规划环核心链 · 调用 planner-core.yml（生产轨：ubuntu-latest · dry_run 按 dispatch）'
    uses: ./.github/workflows/planner-core.yml
    permissions:         # 调用作业显式授予全量（called workflow 不能提权；见头注纪律）
      issues: write
      contents: write
      pull-requests: write
      actions: write
    with:
      runner: ubuntu-latest
      # schedule 事件无 inputs ⇒ 恒 false；workflow_dispatch 演练显式 true
      # （with 值限 github/needs 上下文；string 入参显式比较落地为 boolean，
      #   由 runner 侧按 on.workflow_call.inputs.dry_run 的 boolean 类型强制转型）
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      wave_number: ${{ github.event.inputs.wave_number || '' }}
      reason: ${{ github.event.inputs.reason || 'cron' }}
    # 显式映射（短名 LLM/JEV ⇐ repo secret 真身；GITHUB_TOKEN 平台自动授予）
    secrets:
      LLM: ${{ secrets.LLM_API_KEY }}
      JEV: ${{ secrets.DECISION_API_KEY }}

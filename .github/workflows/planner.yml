# ============================================================================
# planner.yml —— P4 规划环定时化（黑灯工厂 · GitHub 协作平面）
# 草案 v1 · 2026-11-06
# 依据：01-建设方案.md（§二 身份与权限模型 / §四 规划环上云 / §八 执行约束）、
#       03-主会话交接.md（§三.2 P4）、00-盘点.md（配额与三机现实）、
#       30-工件/波次自转器-20261106/制度-v1.md（§二 四通道 / §五 OOM 准入 / §六 已知坑）、
#       30-工件/波次自转器-20261106/wave-01.json（af.wave-manifest.v1 字段真源）、
#       状态/模型配额停用-20261105.json（2026-11-06 09:25 版配额现实）。
#       沙箱研究 D-1（manifest schema v1.1：repo/env_precondition/卡面证据段，
#       §3.2 M-5/M-6）＋ CI L-08（fast_tests 字段：acceptance 派生测试登记，
#       只增不改）＋ Q5 盲点 B6（bench 卡 repo 无字段承载活案例）
#       ——schema v1.1 三可选键出处注（2026-11-06；落点 = step 06 constraints
#       的 schema_v1_1_optional_fields 与 step 08 的「v1.1 可选字段」校验段）。
#
# 【部署注记 · P4 落地前必读】
# 1. 运行仓 = factory-os。schedule 触发器只能位于运行仓默认分支；Actions 内置
#    GITHUB_TOKEN 按仓作用域。本环全部读写落在 factory-os：读板（issues/labels）、
#    读账面（波次清单 + 欠账台账）、commit manifest、建 Issue——一 Token 闭环，
#    与 01-建设方案 §二「规划环 = Actions 内置 GITHUB_TOKEN，无需 App/PAT」一致。
#    本文件是 .github 治理仓的母本（staging/planner/planner.yml）；P4 部署动作 =
#    复制为 factory-os/.github/workflows/planner.yml。.github 侧继续持有母本 +
#    提示词模板（planner/planner-prompt.md）+ 配额状态副本（planner/quota-status.json），
#    由本工作流只读拉取。若要求母本直接在 .github 仓运行，跨仓写须改用
#    Repo-Writer App installation token——与 §二 相违，不取。
# 2. 板 = factory-os 的 issues/labels 状态机（label 分类法随 .github 治理面 P1
#    建立：wave + state:queued/dispatched/running/verifying/merge-check/merged/
#    ledgered/parked + legacy）。若运营者裁定板落 af 仓：BOARD_REPO 改 af 且
#    planner 须改跑 af 仓（manifest 随之落 af）或整体改用 App token——P4 上线前
#    定论，禁两仓双板。
# 3. LLM_API_KEY 配于 factory-os 的 repo secret。当前钥匙源头 openBao
#    kv/data/company/LLM-upstream/TokenRhythm-neohorse（基元律动 TokenRhythm；
#    运营者 2026-11-06 夜间指令：规划环 LLM 切 deepseek-v4.1-flash-1017）。
#    前源 kv/data/company/LLM-upstream/Zhipu/zhipu-bigmodel-CodingPlan-1（GLM，
#    已降 fallback）。STEP_API_KEY（stepfun 备用通道）同为使役 secret，默认不走。
#    纪律：明文只进 secret；禁入 git、禁打印、禁进 artifact（01-建设方案 §八）。
# 4. Runner = ubuntu-latest（GitHub 托管；公开仓免费分钟前提见 02-清单 ④）。
#    anolis-heavy 自托管（P2）只服务 gates.yml——规划环不吃算力、不碰 cargo。
# 5. 配额现实（状态/模型配额停用-20261105.json workflow_model_policy 段 · 运营者
#    2026-11-06 裁定）：individual plan GLM-5.3-Flash 全面放开，规划环 LLM 调用
#    rank1 = account:bigmodel-individual-coding-plan/GLM-5.3-Flash；fallback =
#    new-provider/step-5-preview（key 2026-12-05 20:00 过期）。GLM-5.3 与其余
#    GLM 账户仍持至 2026-11-06 18:00、minimax 周额度 EXHAUSTED（禁用至周重置）
#    ⇒ 施工通道集仍为 anolis-build / local-api / bot-lane（规划环自用模型走 GLM）。
# 6. 调用预算：cron 提频为每 10 分钟一次（job 唤醒闸先判「值不值得烧贵腿」），
#    GLM 规划调用稳态仍 ≤2 次/h——单跑硬顶 2 次（首发 + 1 重试）+ 03b 每小时
#    配额闸原样不动；workflow_dispatch 手动跑同样计数（跨跑守卫见 03a/03b/03c，
#    Actions cache best-effort——cache 可能 miss/evict，故单跑硬顶才是主闸）。
#    唤醒闸只省成本不是预算闸本体（见 9）。
# 7. 分支保护实况（P4 落地实测）：factory-os main = 要求 PR + required check
#    `gates` + enforce_admins ⇒ planner 直推必被 GitHub 拒。故取两段式（已落地）：
#    manifest 先推 `planner/<wave>` 分支 → gh api 开 PR（base main）→ 轮询
#    `gates` 绿后本环 PUT squash 合入（pull-requests:write + contents:write 均
#    已在权限内）。波次清单/wave-*.json 已按口径修正移出 CODEOWNERS 判官锁
#    （manifest 是规划产物非判据件）⇒ planner PR 0 批准即可合。gates 未绿 ⇒
#    PR 留开、run 红，fail-loud 留运营者处置（禁假绿）。
# 8. GITHUB_TOKEN 的 push 默认不触发其它工作流——不会形成 gates 重跑环。
#    （planner/<wave> 分支 push 不触发；PR 开立触发 gates 一次，即 09b 轮询的那次。）
# 9. 唤醒闸（job `wake`，2026-11-06 试点一落地；依据 30-工件/决策模型落点研究-
#    20261106/S2-系统落点.md D1 + 试点一草案）：schedule 提频 '*/10 * * * *' 后，
#    每次唤醒先用决策模型判「这一刻值不值得烧一次贵腿规划调用」。
#    ① 判定面：Jev（POST https://tokenrhythm.studio/v1/systemone，model=
#      NeoHorse-Jev-4B，questions.wake=choice{run,skip}，超时 12s，key 走 repo
#      secret DECISION_API_KEY——明文源头 openBao kv/data/company/LLM-upstream/
#      TokenRhythm-neohorse api_key，禁打印禁落盘）。choice==skip 且 confidence
#      ≥0.8 才 skip；skip ⇒ plan job 整体跳过（job 级 if，16 步一字不动），
#      不调 GLM 不建卡不 commit，wake job 写 skip 摘要后 exit 0 结束 run。
#    ② 确定性兜底三连（缺一不可；Jev 只做成本优化不做安全闸）：
#      · 波次清单/ 最新 manifest 提交距今 >60 分钟 ⇒ 强制 run（防饿死）；
#      · Jev 调用失败/超时/422/非 JSON/缺席 secret ⇒ fail-open 强制 run（回到
#        现行全跑行为）；
#      · 板面近 10 分钟有新 issue/PR 事件 ⇒ 强制 run。
#    ③ 信号读取（gh api 只读，全失败也 fail-open 强制 run）：open issues 数、
#      近 10 分钟 issue/PR 事件数、manifest 距今分钟数——三者进 Jev state 文本，
#      决策与概率写 step summary（可观测）。
#    ④ C 边界：Jev 的 skip 只是「这一刻不规划」，不是「规划结果无效」——step 08
#      校验、09b gates 绿判合并、2 次/h 配额闸一字不动。回退预案：删 '*/10'
#      schedule 一条即回到现状。
#
# 【模型与配额实读口径（注释留证；密钥绝不硬编码）】
#   provider_id = account:bigmodel-individual-coding-plan（智谱 individual coding plan）
#   model_id    = GLM-5.3-Flash
#   base_url    = https://open.bigmodel.cn/api/coding/paas/v4（OpenAI 兼容 /chat/completions）
#   改向依据：运营者 2026-11-06 裁定（状态/模型配额停用-20261105.json
#     workflow_model_policy 段：rank1=account:bigmodel-individual-coding-plan/
#     GLM-5.3-Flash；fallback=new-provider/step-5-preview；applies_to 含规划环）。
#   实读来源（2026-11-06）：
#     ① openBao kv/data/company/LLM-upstream/Zhipu/zhipu-bigmodel-CodingPlan-1：
#        api_key + base_url（同上）成对在位；本机实测 GLM-5.3-Flash 200 出词；
#     ② 本机 ~/.zcode/v2/config.json provider/builtin:bigmodel-coding-plan 同族
#        （Anthropic 形态端点，非本环取用形态）；
#     ③ 状态/模型配额停用-20261105.json workflow_model_policy：改向裁定真源。
#   机器可读副本：.github 仓 planner/quota-status.json（主代理从
#   状态/模型配额停用-*.json 同步；该状态件按 factory-os README §三 不入 factory-os）。
# ============================================================================

name: planner

on:
  schedule:
    # 每 10 分钟轻唤醒：由 job `wake`（唤醒闸，见头注 9）先判值不值得烧贵腿；
    # 提频换响应性，GLM 调用稳态仍被 03b 配额闸钉在 ≤4 次/h（2026-11-07 运营者授权 2→4，见 env 注）
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = 只规划+校验+artifact，不 commit 不建 Issue（演练）'
        required: false
        default: 'false'
      wave_number:
        description: '覆盖波次号（如 07；留空 = 现有最大波次 + 1）'
        required: false
        default: ''
      reason:
        description: '手动触发事由（进 run 摘要与 Issue 回执）'
        required: false
        default: 'manual-dispatch'

permissions:
  issues: write          # 按卡建 Issue（状态机起点 state:queued）
  contents: write        # commit wave manifest 到 factory-os（append-only）
  pull-requests: write   # 预留：P5 起自动合线腿（本工作流不开 PR、不合线）
  actions: write         # planner 自 rerun 红门/自体检（POST /actions/runs/{id}/rerun）

concurrency:             # 单写者：禁重叠跑双解（与防双解占用规则同向）
  group: planner
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  ORG: 'CloudCrane-Software'
  BOARD_REPO: 'factory-os'
  GOVERNANCE_REPO: '.github'
  # 任务书口径「factory-os/波次/」= 仓内实况 波次清单/（staging/factory-os/README.md §一）
  WAVE_DIR: '波次清单'
  LEDGER_FILE: '账本/阶段欠账台账.md'
  # —— 规划环 LLM：基元律动 TokenRhythm deepseek（运营者 2026-11-06 夜间指令：
  #    GLM 高峰期 manifest M-1 形制漂移 4/5 败 14:40-15:20Z 实读；deepseek 探针
  #    3/3 守约、2.5-3.6s；密钥只走 secret LLM_API_KEY）——
  LLM_BASE_URL: 'https://tokenrhythm.studio/v1'
  LLM_MODEL: 'deepseek-v4.1-flash-1017'
  LLM_PROVIDER: 'tokenrhythm'
  # —— 硬配额与预算（= 制度-v1 §五 + wave-01.json budgets 真源）——
  # 2026-11-07 运营者授权（规划质量二期：质量提升的多花 token 全上）：
  #   小时调用上限 2→4。03b 配额闸语义零弱化（fail-closed：超限即 skip、
  #   不调 LLM 不建卡不 commit）——放宽的只是预算帽，不是判据面。
  MAX_API_CALLS_PER_HOUR: '4'
  MAX_CARDS_PER_WAVE: '20'
  ANOLIS_MEM_CAP_G: '45'
  LOCAL_MEM_CAP_G: '3'
  ANOLIS_CONCURRENCY: '4'
  ANOLIS_CARD_MIN_G: '6'
  ANOLIS_CARD_MAX_G: '10'
  RUN_REASON: ${{ inputs.reason || 'cron' }}
  DRY_RUN: ${{ inputs.dry_run || 'false' }}
  WAVE_OVERRIDE: ${{ inputs.wave_number || '' }}

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # 唤醒闸（试点一 · S2-D1；D-91/factory-os#24 补强段同件窗落码）：schedule '*/10'
  # 先判「这一刻值不值得烧贵腿」。确定性兜底序（Jev 只做成本优化不做安全闸）：
  #   ① manifest 距今 >60 分钟 ⇒ 强制 run；② Jev 不可用（超时 10s/非 JSON/不可达）
  #     ⇒ 整点外 wakeup suppress、整点照跑（fail-open 到现状）；③ 板面近 10 分钟
  #     有新 issue/PR 事件 ⇒ 强制 run；④ 连续压制 ≥6 ⇒ 强制 go（防饿死）。
  # 仅 Jev choice==skip 且 confidence≥该路阈值 才 skip；skip ⇒ plan job 整体跳过，
  # 不调 GLM 不建卡不 commit。决策与概率写 step summary（可观测）。
  # shadow（D-91 验收①）：DRY_RUN=true 决策只进 jev-shadow.json 不生效（plan job
  # 旁路 skip 照跑全链留证）。S1 约束：三路一适配器/单路 2s/429 退避/主→备自切/
  # 三路阈值各自标定禁共用。`*/10` 提频施工窗仍归 fos#17 接缝注记（本段零改 schedule）。
  # ══════════════════════════════════════════════════════════════════════════
  wake:
    name: '唤醒闸 · Jev 决策 + 确定性兜底三连'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      shadow_record: ${{ steps.gate.outputs.shadow_record }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DECISION_API_KEY: ${{ secrets.DECISION_API_KEY }}   # 缺席 ⇒ 兜底② fail-open 强制 run
    steps:
      - name: '唤醒闸 · 恢复连压计数账本（best-effort；cache miss ⇒ 归零，兜底①另有 60 分钟饿死界）'
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: jev-wake-state.json
          key: jev-wake-state-${{ github.run_id }}
          restore-keys: |
            jev-wake-state-
      - name: '唤醒闸 · 聚合板面信号 → Jev 决策（choice run/skip · 兜底①②③④ · shadow 留证）'
        id: gate
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          ORG, REPO = os.environ["ORG"], os.environ["BOARD_REPO"]
          API = "https://api.github.com"
          sig_errors = []      # 信号读取异常（fail-open 依据，进摘要）
          jev_errors = []      # Jev 调用异常（兜底②边界依据，进摘要）
          signals = {"checked_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
                     "open_issues": None, "recent_events_10min": None,
                     "manifest_age_min": None}

          def gh(path):
              req = urllib.request.Request(API + path,
                                           headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                                    "Accept": "application/vnd.github+json",
                                                    "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=300) as r:
                  return json.loads(r.read().decode("utf-8"))

          # ── 信号聚合（gh api 只读，三次便宜读数）──
          try:   # ① open issues 数（不含 PR）
              signals["open_issues"] = gh(
                  "/search/issues?q=repo:%s/%s+is:issue+state:open&per_page=1" % (ORG, REPO)
              )["total_count"]
          except Exception as e:
              sig_errors.append("open_issues 读取失败：%s" % type(e).__name__)
          try:   # ② 近 10 分钟 issue/PR 事件数（created/updated/commented 都会推 updated_at）
              since = (datetime.now(timezone.utc) - timedelta(minutes=10)).strftime("%Y-%m-%dT%H:%M:%SZ")
              signals["recent_events_10min"] = len(gh(
                  "/repos/%s/%s/issues?state=all&since=%s&per_page=100" % (ORG, REPO, since)))
          except Exception as e:
              sig_errors.append("recent_events 读取失败：%s" % type(e).__name__)
          try:   # ③ 波次清单/ 最新 manifest 提交距今分钟数（路径须 percent-encode，urllib URL 非 ASCII 会 UnicodeEncodeError）
              c = gh("/repos/%s/%s/commits?path=%s&per_page=1" % (ORG, REPO, urllib.parse.quote("波次清单")))
              d = datetime.fromisoformat(c[0]["commit"]["committer"]["date"].replace("Z", "+00:00"))
              age = int((datetime.now(timezone.utc) - d).total_seconds() // 60)
              signals["manifest_age_min"] = max(age, 0)   # 钟差钳零
              signals["manifest_last_commit_at"] = c[0]["commit"]["committer"]["date"]
          except Exception as e:
              sig_errors.append("manifest_age 读取失败：%s" % type(e).__name__)

          # ══ D-91（factory-os#24）唤醒闸补强段（排期补录表①：jev-p1 验收并入本卡同件窗）══
          # ① shadow：DRY_RUN=true ⇒ 决策只进 jev-shadow.json 不生效（plan job 旁路 skip），
          #    「重合率 ≥80% 空转被压对 / 有活被压=0」由 shadow 留证数据累计评读；
          # ② 连续压制 ≥6 ⇒ 强制 go（计数进 jev-wake-state.json，cache 持久化——
          #    planner-call-log.json 同族账本形态；cache miss ⇒ 计数归零，饿死界另有兜底①）；
          # ③ fail-open 边界：Jev 超时 10s / 非 JSON / 不可达 ⇒ 整点外 wakeup 一律 suppress、
          #    整点照跑（fail-open 到现状＝每小时全跑节拍；workflow_dispatch 显式意图
          #    优先照跑）；DECISION_API_KEY 缺席同此边界（S2 试点一「缺席⇒同分支」）；
          # ④ S1 供给约束（入禁项）：三路一适配器、单路短超时 2s、429 退避、主→备自动切换、
          #    三路阈值各自标定禁共用（备路阈值未经环境量显式注入＝不启用）。
          # `*/10` 提频施工窗仍归 fos#17 接缝注记——本段零改 on.schedule。
          DRY_RUN_SHADOW = (os.environ.get("DRY_RUN") or "false") == "true"
          SUPPRESS_RELEASE_N = 6

          def load_suppress_count():
              """连压计数恢复（cache restore 步已拉回 jev-wake-state.json；miss=0——
              误归零方向=多跑不饿死，fail-open 向，兜底①另有 60 分钟界）。"""
              try:
                  return int(json.load(open("jev-wake-state.json", encoding="utf-8"))
                             .get("consecutive_suppress") or 0)
              except Exception:
                  return 0

          # ── S1 三路一适配器：主路（在役 tokenrhythm/systemone）＋两备路（端点/密钥/
          #    阈值三要素经环境量供给；要素不齐＝该路不启用，结构在场、切换自动）──
          CHANNELS = [
              {"name": "primary", "url": "https://tokenrhythm.studio/v1/systemone",
               "model": "NeoHorse-Jev-4B", "key_env": "DECISION_API_KEY",
               "threshold": 0.8, "threshold_src": "在役标定（试点一：skip 须 confidence≥0.8）"},
              {"name": "backup1", "url": os.environ.get("DECISION_BACKUP1_URL") or "",
               "model": os.environ.get("DECISION_BACKUP1_MODEL") or "decision-model-preview",
               "key_env": "DECISION_BACKUP1_KEY", "threshold_env": "DECISION_BACKUP1_THRESHOLD",
               "threshold": None,
               "threshold_src": "禁共用（S1）——备路阈值须独立标定后经 DECISION_BACKUP1_THRESHOLD 注入"},
              {"name": "backup2", "url": os.environ.get("DECISION_BACKUP2_URL") or "",
               "model": os.environ.get("DECISION_BACKUP2_MODEL") or "jev-4b-local",
               "key_env": "DECISION_BACKUP2_KEY", "threshold_env": "DECISION_BACKUP2_THRESHOLD",
               "threshold": None,
               "threshold_src": "禁共用（S1）——备路阈值须独立标定后经 DECISION_BACKUP2_THRESHOLD 注入"},
          ]
          ADAPTER_ATTEMPT_TIMEOUT_S = 2   # S1：单路短超时 1–2s
          ADAPTER_BUDGET_S = 10           # ③ 边界判据源：Jev 超时 10s ⇒ fail-open 分支

          def channel_enabled(ch):
              if not (os.environ.get(ch["key_env"]) or ""):
                  return False, "密钥环境量缺席"
              if ch.get("threshold") is None:
                  v = os.environ.get(ch.get("threshold_env") or "") or ""
                  if not v:
                      return False, "阈值未标定（S1 禁共用——须独立标定后注入）"
                  try:
                      ch["threshold"] = float(v)
                  except ValueError:
                      return False, "阈值非数"
                  ch["threshold_src"] = "env:%s" % ch["threshold_env"]
              if not ch["url"]:
                  return False, "端点缺席"
              return True, ""

          def adapter_decide(state_text, questions, errors):
              """decide(state, questions[])：按 CHANNELS 序尝试；429 退避 1s 重试同路一次
              再换下路（主→备自动切换）；任一路合法应答即返回。全路未果 ⇒ (None, attempts)
              ——上抛由兜底②边界分支处置（整点照跑/整点外 suppress）。"""
              t0 = time.monotonic()
              attempts = []
              for ch in CHANNELS:
                  ok, why = channel_enabled(ch)
                  if not ok:
                      attempts.append({"channel": ch["name"], "skipped": why})
                      continue
                  leg = "try"
                  while True:
                      budget = ADAPTER_BUDGET_S - (time.monotonic() - t0)
                      if budget <= 0:
                          errors.append("适配器 10s 预算耗尽（channel=%s）" % ch["name"])
                          attempts.append({"channel": ch["name"], "error": "预算耗尽"})
                          return None, attempts
                      body = {"model": ch["model"], "state": state_text, "questions": questions}
                      req = urllib.request.Request(
                          ch["url"], data=json.dumps(body, ensure_ascii=False).encode("utf-8"),
                          headers={"Authorization": "Bearer " + os.environ[ch["key_env"]],
                                   "Content-Type": "application/json"}, method="POST")
                      try:
                          with urllib.request.urlopen(
                                  req, timeout=min(ADAPTER_ATTEMPT_TIMEOUT_S, max(budget, 0.1))) as r:
                              payload = json.loads(r.read().decode("utf-8"))
                      except urllib.error.HTTPError as e:
                          ms = int((time.monotonic() - t0) * 1000)
                          attempts.append({"channel": ch["name"], "leg": leg, "http": e.code, "ms": ms})
                          errors.append("%s HTTP %s（%sms）" % (ch["name"], e.code, ms))
                          if e.code == 429 and leg == "try":
                              time.sleep(1.0)          # 429 退避后重试同路一次
                              leg = "retry-after-429"
                              continue
                          break                        # 非 429／重试仍败 ⇒ 换下路（主→备自动切换）
                      except Exception as e:
                          ms = int((time.monotonic() - t0) * 1000)
                          attempts.append({"channel": ch["name"], "leg": leg,
                                           "error": type(e).__name__, "ms": ms})
                          errors.append("%s %s（%sms）" % (ch["name"], type(e).__name__, ms))
                          break                        # 超时/不可达 ⇒ 换下路
                      ms = int((time.monotonic() - t0) * 1000)
                      ans = (payload.get("answers") or {}).get("wake") or {}
                      if ans.get("choice") not in ("run", "skip"):
                          attempts.append({"channel": ch["name"], "leg": leg,
                                           "error": "非 JSON/缺合法 choice", "ms": ms})
                          errors.append("%s 非 JSON/缺合法 choice（%sms）" % (ch["name"], ms))
                          break                        # 非法输出 ⇒ 换下路
                      try:
                          conf = float(ans.get("confidence"))
                      except (TypeError, ValueError):
                          attempts.append({"channel": ch["name"], "leg": leg,
                                           "error": "confidence 非法", "ms": ms})
                          errors.append("%s confidence 非法（%sms）" % (ch["name"], ms))
                          break
                      return {"choice": ans["choice"], "confidence": conf,
                              "probabilities": ans.get("probabilities"), "channel": ch["name"],
                              "threshold": ch["threshold"], "threshold_src": ch["threshold_src"],
                              "ms": ms}, attempts
              return None, attempts

          # ── 判定：确定性兜底 → Jev（skip 须 confidence≥该路阈值）──
          def decide(sig, serr, jerr, jev, suppress_count, minute_utc, trigger):
              """返回 (decision, family, reason)。family ∈ 兜底0|兜底1|兜底3|兜底4|兜底2a|兜底2b|jev。"""
              age, ev = sig.get("manifest_age_min"), sig.get("recent_events_10min")
              if serr or age is None or ev is None:      # 信号读不全 ⇒ 未知状态 ⇒ 放行（fail-open）
                  return ("run", "兜底0", "信号读取不全 fail-open ⇒ 强制 run（%s）"
                          % (serr[0] if serr else "signals 缺场"))
              if age > 60:                               # 兜底①：manifest >60 分钟必跑（防饿死）
                  return ("run", "兜底1", "manifest 距今 %d 分钟 >60 ⇒ 强制 run" % age)
              if ev > 0:                                 # 兜底③：板面近 10 分钟有事件必跑
                  return ("run", "兜底3", "板面近 10 分钟 %d 件 issue/PR 事件 ⇒ 强制 run" % ev)
              if suppress_count >= SUPPRESS_RELEASE_N:   # 兜底④：连压 ≥6 必放行（D1 验收②）
                  return ("run", "兜底4", "连续压制 %d 次 ≥%d ⇒ 强制 go（防饿死放行）"
                          % (suppress_count, SUPPRESS_RELEASE_N))
              on_beat = (trigger != "schedule") or (minute_utc == 0)   # 整点=调度钟 UTC 分钟 0；dispatch 非节拍
              if jev is None:
                  # 兜底②（D1 修订）：超时 10s/非 JSON/不可达 ⇒ 整点外 wakeup suppress、整点照跑
                  if on_beat:
                      return ("run", "兜底2a", "Jev 不可用（%s）且整点/dispatch ⇒ 照跑（fail-open 到现状）"
                              % (jerr[-1] if jerr else "未知"))
                  return ("skip", "兜底2b", "Jev 不可用（%s）且非整点 ⇒ 整点外 wakeup suppress、整点照跑"
                          % (jerr[-1] if jerr else "未知"))
              thr = jev["threshold"]
              if jev["choice"] == "skip" and jev["confidence"] >= thr:
                  return ("skip", "jev", "Jev[%s] skip · confidence=%.2f ≥该路阈值 %.2f ⇒ 压制（阈值各自标定禁共用）"
                          % (jev["channel"], jev["confidence"], thr))
              return ("run", "jev", "Jev[%s] %s · confidence=%.2f（skip 须 ≥该路阈值 %.2f）⇒ run"
                      % (jev["channel"], jev["choice"], jev["confidence"], thr))

          trigger = os.environ.get("GITHUB_EVENT_NAME", "?")
          minute_utc = datetime.now(timezone.utc).minute
          suppress_count = load_suppress_count()

          # 兜底①③④可先于 Jev 判出 ⇒ 不必花钱问 Jev；其余才调用
          pre = (bool(sig_errors) or signals.get("manifest_age_min") is None
                 or signals.get("recent_events_10min") is None
                 or signals["manifest_age_min"] > 60 or signals["recent_events_10min"] > 0
                 or suppress_count >= SUPPRESS_RELEASE_N)
          jev, attempts = None, []
          if not pre:
              state = ("factory-os planner 唤醒闸 · %s（UTC）\n"
                       "open_issues=%s\n"
                       "近10分钟issue/PR事件=%s\n"
                       "波次清单 manifest 最新提交距今=%s 分钟（%s）\n"
                       "trigger=%s · 说明：run=此刻值得烧一次 GLM 规划调用；"
                       "skip=板面静滞且 manifest 很新（<60 分钟），跳过本轮省成本。"
                       % (signals["checked_at"], signals["open_issues"],
                          signals["recent_events_10min"], signals["manifest_age_min"],
                          signals.get("manifest_last_commit_at", "<读不到>"), trigger))
              questions = {"wake": {
                  "type": "choice",
                  "criteria": {"run": "板面有动静、manifest 超 60 分钟未动、或状态可疑——值得规划一轮",
                               "skip": "板面完全静滞且 manifest 很新（<60 分钟）——跳过本轮"},
                  "instructions": "这是成本优化预筛不是安全闸：不确定一律选 run（fail-open 方向）。"}}
              jev, attempts = adapter_decide(state, questions, jev_errors)

          decision, family, reason = decide(signals, sig_errors, jev_errors, jev,
                                            suppress_count, minute_utc, trigger)

          # ── 连压计数落账（仅生效压制/放行计数；shadow 决策不生效不计数）──
          new_count = suppress_count
          if not DRY_RUN_SHADOW:
              new_count = (suppress_count + 1) if decision == "skip" else 0
              with open("jev-wake-state.json", "w", encoding="utf-8") as f:
                  json.dump({"consecutive_suppress": new_count,
                             "updated_at": signals["checked_at"], "last_family": family},
                            f, ensure_ascii=False)

          # ── shadow 留证（DRY_RUN=true）：决策只进 jev-shadow.json 链路（由 plan job
          #    08s 步并 actual outcome 落盘 artifact），本 job 经 output 携带 ──
          shadow_record = None
          if DRY_RUN_SHADOW:
              shadow_record = {
                  "checked_at": signals["checked_at"], "trigger": trigger,
                  "minute_utc": minute_utc, "would_decision": decision,
                  "would_family": family, "would_reason": reason,
                  "signals": {k: signals.get(k) for k in
                              ("open_issues", "recent_events_10min", "manifest_age_min")},
                  "consecutive_suppress_before": suppress_count,
                  "consecutive_suppress_would": (suppress_count + 1) if decision == "skip" else 0,
                  "enforced": False,
                  "note": "shadow：决策只留证不生效（重合率≥80% 空转被压对/有活被压=0 由累计数据评读）",
              }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("decision=%s\nreason=%s\n" % (decision, reason.replace("\n", " ")))
              if shadow_record is not None:
                  f.write("shadow_record=%s\n" % json.dumps(shadow_record, ensure_ascii=False).replace("\n", " "))
          line = "唤醒闸决策: decision=%s · %s · open_issues=%s · 近10min事件=%s · manifest距今=%s分钟 · 连压计数=%d%s" % (
              decision, reason, signals["open_issues"], signals["recent_events_10min"],
              signals["manifest_age_min"], suppress_count,
              "（shadow 不生效）" if DRY_RUN_SHADOW else " → 新计数 %d" % new_count)
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### 唤醒闸决策\n\n| 项 | 值 |\n|---|---|\n")
              f.write("| decision | **%s**%s |\n| 判定族 | %s |\n| 理由 | %s |\n"
                      % (decision, "（shadow 留证不生效）" if DRY_RUN_SHADOW else "",
                         family, reason))
              f.write("| open_issues | %s |\n| 近10min issue/PR 事件 | %s |\n| manifest 距今 | %s 分钟 |\n"
                      % (signals["open_issues"], signals["recent_events_10min"], signals["manifest_age_min"]))
              f.write("| 连压计数 | 前=%d %s |\n"
                      % (suppress_count, ("（shadow 不计数）" if DRY_RUN_SHADOW else "→ 新=%d" % new_count)))
              if jev:
                  f.write("| Jev | channel=%s · choice=%s · confidence=%.2f · 阈值=%.2f（%s）· %sms |\n"
                          % (jev["channel"], jev["choice"], jev["confidence"], jev["threshold"],
                             jev["threshold_src"], jev["ms"]))
              else:
                  f.write("| Jev | 未调用（确定性兜底先行）或全路未果（兜底②边界分支） |\n")
              for a in attempts:
                  f.write("| 适配器尝试 | %s |\n" % json.dumps(a, ensure_ascii=False))
              if shadow_record is not None:
                  f.write("| shadow 留证 | would=%s/%s · enforced=false（jev-shadow.json 链路） |\n"
                          % (shadow_record["would_decision"], shadow_record["would_family"]))
              for e in sig_errors + jev_errors:
                  f.write("| WARN | %s |\n" % e)
              f.write("\n> 兜底序：① manifest>60 分钟必跑 ② Jev 不可用⇒整点外 suppress、整点照跑 "
                      "③ 近 10 分钟有事件必跑 ④ 连压 ≥6 强制 go；仅 Jev skip 且 confidence≥该路阈值才压制。\n"
                      "> shadow（DRY_RUN=true）：决策只进 jev-shadow.json 不生效。\n")
          if decision == "skip" and not DRY_RUN_SHADOW:
              print("唤醒闸：suppress——plan job 跳过（不调 GLM 不建卡不 commit）；连压 %d 次，≥%d 将强制放行"
                    % (new_count, SUPPRESS_RELEASE_N))
          elif decision == "skip":
              print("唤醒闸：would-suppress（shadow 不生效——plan job 照跑全链留证）")
          sys.exit(0)
          PY
      - name: '唤醒闸 · 保存连压计数账本（best-effort）'
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: jev-wake-state.json
          key: jev-wake-state-${{ github.run_id }}

  plan:
    needs: wake
    if: needs.wake.outputs.decision != 'skip' || inputs.dry_run == 'true'   # skip ⇒ 跳过；shadow（D-91 验收①）：DRY_RUN=true 决策不生效照跑全链留证
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh api 全程只用内置 Token（01-建设方案 §二）
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}   # 规划环 LLM 钥匙（GLM-5.3-Flash；明文只进 secret，不回显）
    steps:
      - name: '00 · 运行参数回显（禁打印任何密钥）'
        run: |
          {
            echo "### planner · P4 规划环"
            echo "- run_id=${GITHUB_RUN_ID} · trigger=${GITHUB_EVENT_NAME} · reason=${RUN_REASON}"
            echo "- dry_run=${DRY_RUN} · wave_override=${WAVE_OVERRIDE:-<auto>}"
            echo "- board=${ORG}/${BOARD_REPO} · wave_dir=${WAVE_DIR}"
            echo "- model=${LLM_MODEL} @ ${LLM_BASE_URL}（key 走 secret LLM_API_KEY，不回显）"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 双仓落盘：.github 治理面（模板+配额副本）与 factory-os（账面+板）──
      - name: '01 · checkout 治理面（.github：提示词模板 + 配额状态副本）'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/${{ env.GOVERNANCE_REPO }}
          path: governance
          sparse-checkout: |
            planner
          persist-credentials: false

      - name: '02 · checkout 账面（factory-os：波次清单 + 账本，板同仓）'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: factory-os
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # ── 调用账本（配额计数）：cache best-effort，供 03b 跨跑守卫 ──
      - name: '03a · 恢复调用账本（best-effort；cache 可能 miss/evict）'
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: planner-call-log.json
          key: planner-call-log-${{ github.run_id }}
          restore-keys: |
            planner-call-log-

      # ── 配额闸 + 调用预算守卫：不满足即空转（skip 不是失败，artifact 留证）──
      - name: '03b · 配额闸 + 调用预算守卫（fail-closed）'
        id: quota
        run: |
          set -euo pipefail
          touch planner-call-log.json
          python3 -I - <<'PY'
          import json, os, re, sys
          from datetime import datetime, timezone, timedelta

          TZ8 = timezone(timedelta(hours=8))
          now = datetime.now(TZ8)
          gov = "governance/planner/quota-status.json"
          result = {
              "checked_at": now.isoformat(timespec="seconds"),
              "quota_file": gov,
              "checks": [],
              "plan_allowed": False,
              "skip_reason": None,
              "warnings": [],
          }

          def finish():
              with open("planner-quota.json", "w", encoding="utf-8") as f:
                  json.dump(result, f, ensure_ascii=False, indent=1)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("plan_allowed=%s\n" % ("true" if result["plan_allowed"] else "false"))
              print("quota guard: plan_allowed=%s · reason=%s"
                    % (result["plan_allowed"], result["skip_reason"] or "-"))

          if not os.path.exists(gov):
              result["skip_reason"] = ("配额状态副本缺场（.github/planner/quota-status.json）——fail-closed 拒调；"
                                       "P4 上线前须把 状态/模型配额停用-*.json 同步为该副本"
                                       "（该状态件按 factory-os README §三 不入 factory-os）")
              finish()
              sys.exit(0)

          q = json.load(open(gov, encoding="utf-8"))
          prio = q.get("priority") or []
          rank1 = prio[0] if prio else {}
          model = rank1.get("model_id")
          provider = rank1.get("provider_id")
          result["rank1"] = {"provider_id": provider, "model_id": model, "note": rank1.get("note")}

          ok_rank1 = (model == os.environ["LLM_MODEL"] and provider == os.environ["LLM_PROVIDER"])
          result["checks"].append({"check": "rank1 == %s/%s" % (os.environ["LLM_PROVIDER"], os.environ["LLM_MODEL"]), "ok": bool(ok_rank1)})

          banned = set(((q.get("banned") or {}).get("model_ids")) or [])
          ok_not_banned = os.environ["LLM_MODEL"] not in banned
          result["checks"].append({"check": "%s 不在 banned.model_ids" % os.environ["LLM_MODEL"], "ok": bool(ok_not_banned)})

          m = re.search(r"(\d{4}-\d{2}-\d{2})(?:\s+(\d{2}:\d{2}))?", rank1.get("note") or "")
          if m:
              try:
                  exp = datetime.fromisoformat(m.group(1) + "T" + (m.group(2) or "20:00") + ":00+08:00")
                  days = (exp - now).days
                  result["key_expiry"] = exp.isoformat(timespec="minutes")
                  if days <= 14:
                      result["warnings"].append("LLM_API_KEY %d 天后过期（%s）——轮换统一批前置预警"
                                                % (days, exp.date().isoformat()))
              except ValueError:
                  pass

          cap = int(os.environ.get("MAX_API_CALLS_PER_HOUR", "2"))
          hour = now.strftime("%Y%m%d%H")
          calls = []
          if os.path.exists("planner-call-log.json"):
              try:
                  calls = [e for e in json.load(open("planner-call-log.json", encoding="utf-8"))
                           if e.get("hour") == hour]
              except Exception:
                  calls = []
          result["calls_this_hour"] = len(calls)
          result["checks"].append({"check": "本小时已调用 < %d" % cap, "ok": len(calls) < cap})

          result["plan_allowed"] = bool(ok_rank1 and ok_not_banned and len(calls) < cap)
          if not result["plan_allowed"]:
              bits = []
              if not ok_rank1:
                  bits.append("rank1 非 %s/%s（实得 %s/%s）" % (os.environ["LLM_PROVIDER"], os.environ["LLM_MODEL"], provider, model))
              if not ok_not_banned:
                  bits.append("%s 在停用清单" % os.environ["LLM_MODEL"])
              if len(calls) >= cap:
                  bits.append("本小时调用已满 %d 次（≤%d 次/h 纪律）" % (len(calls), cap))
              result["skip_reason"] = "；".join(bits)
          finish()
          sys.exit(0)
          PY

      - name: '03c · 保存调用账本（best-effort）'
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: planner-call-log.json
          key: planner-call-log-${{ github.run_id }}

      # ── 读板：issues + labels 聚合状态机（幂等与防双解的事实源）──
      - name: '04 · 读板（gh api：issues + labels 聚合状态）'
        if: steps.quota.outputs.plan_allowed == 'true'
        run: |
          set -euo pipefail   # 本步无「预期失败」命令，全部必须成功（制度 §六.2 反模式不适用）
          gh api "repos/${ORG}/${BOARD_REPO}/issues?state=open&per_page=100" --paginate \
            --jq '.[] | select(.pull_request == null) | {number, title, labels: [.labels[].name], body, updated_at}' \
            > board-issues.ndjson
          python3 -I - <<'PY'
          import json, os, re
          from datetime import datetime, timezone, timedelta

          issues = []
          with open("board-issues.ndjson", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if line:
                      issues.append(json.loads(line))

          by_state, by_wave, in_flight, occupied, titles = {}, {}, set(), set(), []
          for it in issues:
              labels = it.get("labels") or []
              for lb in labels:
                  if lb.startswith("state:"):
                      by_state[lb] = by_state.get(lb, 0) + 1
                  if lb == "wave" or lb.startswith("wave-"):
                      by_wave[lb] = by_wave.get(lb, 0) + 1
              titles.append({"number": it.get("number"), "title": it.get("title"), "labels": labels})
              m = re.match(r"\[wave-\d+\]\s+([A-Za-z0-9._-]+)", it.get("title") or "")
              if m:
                  in_flight.add(m.group(1))
              m2 = re.search(r"【债号】`([^`]+)`", it.get("body") or "")
              if m2:
                  occupied.add(m2.group(1).strip())

          board = {
              "generated_at": datetime.now(timezone(timedelta(hours=8))).isoformat(timespec="seconds"),
              "repo": "%s/%s" % (os.environ["ORG"], os.environ["BOARD_REPO"]),
              "open_issues_total": len(issues),
              "by_state_label": by_state,
              "by_wave_label": by_wave,
              "in_flight_task_ids": sorted(in_flight),
              "occupied_debt_anchors": sorted(occupied),
              "issues": titles,
          }
          with open("board-state.json", "w", encoding="utf-8") as f:
              json.dump(board, f, ensure_ascii=False, indent=1)
          print("board: open=%d · in_flight=%d · occupied_anchors=%d"
                % (len(issues), len(in_flight), len(occupied)))
          PY

      # ── 读账面：波次清单（状态机实况）+ 欠账台账行级摘要（锚点宇宙）──
      - name: '05 · 读 factory-os 账面（波次清单 + 欠账台账摘要）'
        if: steps.quota.outputs.plan_allowed == 'true'
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import glob, json, os, re
          from datetime import datetime, timezone, timedelta

          wave_dir = os.path.join("factory-os", os.environ["WAVE_DIR"])
          ledger_path = os.path.join("factory-os", os.environ["LEDGER_FILE"])
          warnings = []
          TERMINAL = {"ledgered", "merged"}

          manifests, all_cards = [], []
          for p in sorted(glob.glob(os.path.join(wave_dir, "wave-*.json"))):
              # ── D-92（factory-os#25）：wave-NN.quality.json 是收卷腿评分件（append-only
              #    审计面），不是 manifest——禁入 manifest 聚合（否则会以 cards=0 幽灵
              #    manifest 混入波次状态机），只走本步末尾 quality_recent 聚合段。
              if p.endswith(".quality.json"):
                  continue
              try:
                  d = json.load(open(p, encoding="utf-8"))
              except Exception as e:
                  warnings.append("manifest 解析失败 %s：%s" % (os.path.basename(p), e))
                  continue
              cards = d.get("cards") or []
              by_state = {}
              for c in cards:
                  s = c.get("state", "?")
                  by_state[s] = by_state.get(s, 0) + 1
              manifests.append({"wave": d.get("wave"), "_file": os.path.basename(p),
                                "cards": len(cards), "by_state": by_state,
                                "base_sha": d.get("base_sha")})
              for c in cards:
                  all_cards.append((d.get("wave"), c))

          nums = []
          for m in manifests:
              mm = re.fullmatch(r"wave-(\d+)", m.get("wave") or "")
              if mm:
                  nums.append(int(mm.group(1)))
          latest = max(nums) if nums else 0
          override = os.environ.get("WAVE_OVERRIDE", "").strip()
          next_num = int(override) if override else latest + 1

          non_terminal = []
          for wv, c in all_cards:
              if c.get("state") not in TERMINAL:
                  non_terminal.append({"task_id": c.get("task_id"), "debt": c.get("debt"),
                                       "wave": wv, "state": c.get("state"),
                                       "channel": c.get("channel"), "mem_budget_g": c.get("mem_budget_g")})

          # 欠账台账行级启发式摘要（单元格内含 | ，不做结构化切分；判双解以板+波次状态机为准）
          anchors, rows_total, done_rows = [], 0, 0
          if os.path.exists(ledger_path):
              with open(ledger_path, encoding="utf-8") as f:
                  for line in f:
                      m = re.match(r"^\|\s*([A-Za-z]{1,5}-[A-Za-z0-9-]+)\s*\|", line)
                      if not m:
                          continue
                      rows_total += 1
                      done = "\u2705" in line   # 台账完成态标记
                      if done:
                          done_rows += 1
                      anchors.append({"id": m.group(1), "done": done,
                                      "waves": sorted(set(re.findall(r"wave-\d+", line)))})
          else:
              warnings.append("欠账台账不在场：%s" % os.environ["LEDGER_FILE"])

          open_anchors = [a["id"] for a in anchors if not a["done"]]
          anchors_tail = anchors[-80:]
          if len(anchors) > len(anchors_tail):
              warnings.append("anchors 截断：仅带末 80 行（open_anchors 全量保留）")

          base_sha = None
          for m in reversed(manifests):
              if m.get("base_sha"):
                  base_sha = m["base_sha"]
                  break

          # ══ D-92（factory-os#25）规划质量回评聚合（planner_quality_recent 输入段）══
          # 读波次清单/wave-NN.quality.json（收卷腿评分器 tools/planner-quality-score.py
          # append-only JSONL，每行 schema=af.wave-quality.v1）——只读消费零改写；
          # 损坏行跳过不聚合（审计面如实留 warning）。去重纪律：同 (wave, task_id)
          # 取末次评分行（append-only 语义=末行为现势），grades/失败模式计数都基于
          # 去重后集合。近 N=3 波入输入段；top_failure_modes 按频次降序取 top-10。
          # advisory 边界：本段产物只进 planner 输入（Q1 §3.4.4 回流），永不触碰
          # step 08 invalid/valid 判定面与 required checks（D7=C-5 禁区）。
          QUALITY_RECENT_N = 3
          quality_recent = {
              "waves": [], "top_failure_modes": [], "advisory_only": True,
              "note": "quality 评级/失败模式只作规划回流输入（advisory）：禁当验收门、"
                      "禁进 required checks、禁改 invalid/valid 判定面；planner 组卡"
                      "须对照 top_failure_modes 自检（prompt §3.8）。",
              "source_files": [],
          }
          q_files = sorted(glob.glob(os.path.join(wave_dir, "wave-*.quality.json")))
          q_waves = []
          for qp in q_files:
              rows, qwarn = [], os.path.basename(qp)
              with open(qp, encoding="utf-8") as f:
                  for ln in f:
                      ln = ln.strip()
                      if not ln:
                          continue
                      try:
                          r = json.loads(ln)
                      except Exception:
                          warnings.append("quality 行解析失败（跳过不聚合）：%s" % qwarn)
                          continue
                      if r.get("schema") == "af.wave-quality.v1" and r.get("record_type") == "card_quality":
                          rows.append(r)
              if rows:
                  q_waves.append({"file": qwarn, "rows": rows})
          for qw in q_waves[-QUALITY_RECENT_N:]:
              last_by_card = {}
              for r in qw["rows"]:
                  last_by_card[(r.get("wave"), (r.get("card") or {}).get("task_id"))] = r
              dedup = list(last_by_card.values())
              grades = {}
              modes = {}
              for r in dedup:
                  if not r.get("scored"):
                      continue
                  g = r.get("grade")
                  if g:
                      grades["quality:%s" % g] = grades.get("quality:%s" % g, 0) + 1
                  for m in r.get("failure_modes") or []:
                      modes[m] = modes.get(m, 0) + 1
              quality_recent["waves"].append({
                  "wave": qw["rows"][-1].get("wave"),
                  "file": qw["file"],
                  "cards_scored": sum(1 for r in dedup if r.get("scored")),
                  "cards_total_lines": len(qw["rows"]),
                  "grades": grades,
                  "failure_modes": dict(sorted(modes.items(), key=lambda kv: -kv[1])),
              })
              quality_recent["source_files"].append(qw["file"])
          merged_modes = {}
          for wv in quality_recent["waves"]:
              for m, n in (wv.get("failure_modes") or {}).items():
                  merged_modes[m] = merged_modes.get(m, 0) + n
          quality_recent["top_failure_modes"] = [
              {"mode": m, "count": n} for m, n in
              sorted(merged_modes.items(), key=lambda kv: -kv[1])[:10]]

          summary = {
              "generated_at": datetime.now(timezone(timedelta(hours=8))).isoformat(timespec="seconds"),
              "wave_dir": os.environ["WAVE_DIR"],
              "manifests": manifests,
              "latest_wave": ("wave-%02d" % latest) if latest else None,
              "next_wave": "wave-%02d" % next_num,
              "wave_expected": "wave-%02d" % next_num,
              "base_sha": base_sha,
              "ledger_file": os.environ["LEDGER_FILE"],
              "ledger_rows_total": rows_total,
              "ledger_done_rows": done_rows,
              "anchors": anchors_tail,
              "open_anchors": open_anchors,
              "non_terminal_cards": non_terminal,
              "quality_recent": quality_recent,
              "warnings": warnings,
          }
          with open("ledger-summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=1)
          print("ledger: manifests=%d · latest=%s · next=%s · rows=%d(done=%d) · open_anchors=%d · non_terminal=%d · quality_waves=%d"
                % (len(manifests), summary["latest_wave"], summary["next_wave"],
                   rows_total, done_rows, len(open_anchors), len(non_terminal),
                   len(quality_recent.get("waves") or [])))
          PY

      # ── 组装规划输入：板状态 + 账本摘要 + 配额状态 + OOM 准入口径 ──
      - name: '06 · 组装规划输入（planner-inputs.json）'
        if: steps.quota.outputs.plan_allowed == 'true'
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json, os
          import subprocess as _sp
          from datetime import datetime, timezone, timedelta

          # 活体钉桩基线：factory-os 检出树的 origin/main（退 HEAD）实读尖端

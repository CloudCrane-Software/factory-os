              "ledger_summary": ledger,
              "quota_status": {
                  "rank1": quota.get("rank1"),
                  "banned_model_ids": ["GLM-5.3", "MiniMax-M3.1-Flash"],
                  "hold_until": "2026-11-06T18:00:00+0800",
                  "key_expiry": quota.get("key_expiry"),
                  "ruling": "运营者 2026-11-06 裁定：individual plan GLM-5.3-Flash 全面放开，规划环 LLM 调用改用 GLM-5.3-Flash（workflow_model_policy）；GLM-5.3 与其余 GLM 账户仍持至 18:00",
                  "source": "状态/模型配额停用-20261105.json（治理副本 governance/planner/quota-status.json）",
              },
              "oom_admission": {
                  "anolis": {
                      "mem_cap_g": 45, "concurrency": 4, "card_range_g": [6, 10],
                      "note": "125G 的 36%；Σmem_budget≤45G；cargo 并发≤4；cargo 必须剥离代理环境变量"
                              "（env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy LC_CTYPE=C.UTF-8）",
                  },
                  "local": {
                      "mem_cap_g": 3, "cargo": "banned",
                      "note": "14G 机昨夜 21:19 真 OOM；只允许 API 轨+门禁 ≈2G；solar 训练另一会话固定占 ~18% 不排程",
                  },
                  "gov": {"card_cap_g": 2, "note": "小件后端手术单卡 ≤2G"},
              },
              "budgets": {"anolis_mem_cap_g": 45, "local_mem_cap_g": 3, "anolis_concurrency": 4},
              # 钉桩基线改喂活体 main 尖端（2026-11-06 夜修）：陈年 wave 文件里的
              # 缩位 base 不是 ref 尖端，模型照抄白名单必死于 M-3 ls-remote——
              # 输入面纠偏，M-1/M-3 判据一字不动。
              "base_sha": live_head,
              "allowed_base_shas": [live_head] if live_head else [],
              "channels_allowed": ["anolis-build", "local-api", "bot-lane"],
              "channels_banned": [
                  {"channel": "GLM/start-plan",
                   "reason": "start-plan 免费窗 2026-11-06 09:00 EXPIRED、start-plan/offpeak/highspeed 账户仍停用（状态/模型配额停用-20261105.json）⇒ 施工通道不派；规划环自用模型已按运营者 2026-11-06 裁定改走 individual plan GLM-5.3-Flash"}
              ],
              "legacy_backlog": legacy,
              # ── D-92（factory-os#25）回评回流输入段（Q1 §3.4.4）：近 N 波规划质量
              #    汇总（step 05 已聚合）——每波 quality:A–D 分布＋高频失败模式计数，
              #    prompt §二输入口径＋§3.8 回流硬规则消费。advisory 边界：只进规划
              #    输入，永不改 invalid/valid 机检判定、永不进 required checks
              #    （D7=C-5 禁区；quality label 只作回流输入禁当门——卡面禁项置顶）。
              "planner_quality_recent": ledger.get("quality_recent") or {
                  "waves": [], "top_failure_modes": [], "advisory_only": True,
                  "note": "回评件缺席（尚无 wave-NN.quality.json）——空段为合法现势，"
                          "planner 无失败模式约束输入时按无此输入组卡",
                  "source_files": []},
              # ── D-92 同批扩展（B-5 交叉一致性 §三-7）：观测输入占位——#15（Q3 观测
              #    输入）落地时只扩本段 fields，禁双头再改 step 05/06 结构。
              "observation_inputs": {
                  "reserved_for": "factory-os#15（Q3 观测输入·同批 planner-inputs 扩展接缝）",
                  "fields": {},
                  "note": "占位段（现势零字段零作用）；#15 消费时同守 advisory 边界"
                          "（观测面只进规划输入，禁入机检闸面/required checks）。",
              },
              "constraints": {
                  "schema": "af.wave-manifest.v1",
                  "state_machine": "queued→(占用闸)→dispatched→running→verifying→(绿)merge-check→merged→ledgered；任一步红→parked+异常队列",
                  "terminal_states": ["ledgered", "merged"],
                  "occupancy_rule": "同一 debt 锚号在（板 open 卡 ∪ 历史波次非终态卡）中至多出现一次；台账无行的债号占用闸 fail-closed——先登记债行或换锚",
                  "judge_protection": "判官/门禁/判据件由仓级 CODEOWNERS 锁 @feasy898，一改即拒收；只读卡走 content-only",
                  "max_cards_per_wave": 20,
                  "no_leaks": "任何字符串字段禁出现凭据形态（机扫 fail-closed）",
                  # ── schema v1.1（2026-11-06）只增不改：af.wave-manifest.v1 十字段
                  #    名称与必填性零触碰；以下三键全部 optional、有值才校验（step 08）。
                  #    出处：沙箱研究 D-1（§3.2 M-5/M-6）＋ CI L-08（fast_tests 只增不改）
                  #    ＋ Q5 盲点 B6（bench 卡 repo 活案例承载）。
                  "schema_v1_1_optional_fields": {
                      "repo": "可选 string，owner/name 形制；有值时 step 08 校验存活性（GET /repos/{repo} 须 HTTP 200）——外部仓活案例承载（Q5 盲点 B6）",
                      "env_precondition": "可选非空 string，环境前置声明（GPU/依赖/代理剥离等）；语义与命令族一致性校验留 #13 干跑/沙箱自检，本环只校非空（沙箱研究 D-1 §3.2 M-5/M-6）",
                      "fast_tests": "可选 string[]，basename 测试件清单（禁命令串/路径分隔符；落点纪律照 CI L-08：factory-os tools/test-*.py 或 af 封闭快速子集）——acceptance 的派生测试登记，只增不改",
                  },
                  "schema_v1_1_directive": "v1.1 只增不改：新卡请尽量携带上述三可选键（可空/可 null）；缺席时 step 08 会透明补 null 并在 manifest-validation.json 的 v1_1 段留痕",
              },
          }
          if legacy_warn:
              inputs["warnings"] = [legacy_warn]

          with open("planner-inputs.json", "w", encoding="utf-8") as f:

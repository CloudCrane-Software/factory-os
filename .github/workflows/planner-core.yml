                        "（总 %dms）——结果已追加，二次调用出 manifest"
                        % (_inv_trace["requested"], _inv_trace["executed"],
                           _inv_trace["unavailable"], _inv_trace["rejected"],
                           _inv_trace["truncated"], _inv_trace["total_ms"]))
                  body["messages"] = body["messages"] + [
                      {"role": "assistant", "content": _inv_text},

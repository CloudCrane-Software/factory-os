          # ══ D-84（factory-os#20）step 08 补强判据面：M-1/M-2/M-3/M-4/M-7/M-8 六项机检
          #    ＋M-5/M-6 判据注释标桩。方向只收紧（禁项置顶：缺项任一硬红 ⇒ invalid
          #    fail-closed；不给既有十校验加豁免口）══
          # ── M-8 词汇正本：板面 label 分类法（2026-11-06 api.github.com
          #    /repos/CloudCrane-Software/factory-os/labels 实读 25 枚中的板面词；
          #    状态机与 .github 治理仓 docs/labels.md wave/* 同构、板面挂 state:*；
          #    GitHub 默认件（bug/enhancement/question…）非板面词汇不入集）──
          BOARD_VOCAB = {
              "wave", "perm/requested",
              "state:queued", "state:running", "state:verifying", "state:merged",
              "state:rejected", "blocked", "legacy",
              "quality:A", "quality:B", "quality:C", "quality:D",
              "ticket:needs-human", "ticket:requested", "ticket:revoked",
          }
          # ── M-4 判官面单源（裁 9 · 2026-11-07 运营者准）：judge-paths.md 静态族
          #    （定义源 .github 治理仓 docs/judge-paths.md §一/§二/§三：含 factory-os
          #    仓级 CODEOWNERS 派生缺口行 .github/workflows/gates.yml（该件 §二表 :82 行注）
          #    与 af 仓 ci/** 判官族/判据钉面）。命中 ⇒ 硬红 invalid——收紧：原仅 warning
          #    不硬红（rt-e82/83 双案拒收主因 = 本次补强直接动机）。
          #    裁 9 依据（原双源 = CODEOWNERS 实读派生 ∪ judge-paths 静态族 → 单源）：
          #    双源时代 CODEOWNERS 源把 /tools/ 整树判官面化，首张真卡
          #    allowed_paths=tools/disk-waterline-carrier.py＋tools/test-disk-waterline-carrier.py
          #    被误拦（run 42366275279 step 08 outcome=invalid）；而今日 57+ 张 tools/ PR
          #    经标准流合线实证 tools/ 非判官禁入面 ⇒ 语义错位，改按登记表点名单判定。
          #    对真判官件此变更属变严方向（登记表点名单 < CODEOWNERS 全树；swev-judge-v2.py
          #    等公认判官件已同批补条登记，.github docs/judge-paths.md §二）。
          #    CODEOWNERS 原样不动（合并期 owner-review 门保留，职责分离：合不进去归
          #    CODEOWNERS／分支保护，判官面判定归登记表单源）──
          JUDGE_KEYWORD = re.compile(
              r"(all-gates\.sh|gate-pins\.list|gate-pins-refresh|gate_inputs|subgates\.list"
              r"|mirror-scan-allowlist|clippy-baseline|scorechain-manifest|CODEOWNERS"
              r"|judge|判官|判据)")
          AF_JUDGE_FAMILY = re.compile(
              r"(?:^|[:/`])(ci/|proofs/|strategies/|packages/reportkit/"
              r"|crates/af-execline/src/judge\.rs|(?:[^\s`]*/)?crates/.*/tests/"
              r"|numbers\.json|deliverables\.yaml|doc-claims\.txt"
              r"|rust-toolchain\.toml|Cargo\.toml|Cargo\.lock)")
          # factory-os 静态缺口族（judge-paths.md §二登记表点名单的机器编码）：

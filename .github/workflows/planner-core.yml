          # ── M-1 形制预检 + 矫正重试（provider 无关；与传输重试共用 ≤2 次/跑硬顶，
          #    不破 ≤2/h 配额；step 08 仍是终裁 fail-closed，本段只改良候选）──
          def _m1_errors(m):
              out = []
              # base_sha 生成侧预检（M-3/白名单同源规则；step 08 仍终裁）：
              # 输入无钉桩基线 ⇒ 字段必须整体省略；有 ⇒ 只许逐字取自白名单。
              bs = m.get("base_sha")
              allowed_bs = inputs.get("allowed_base_shas") or []
              if bs is not None and not allowed_bs:
                  out.append("base_sha：输入 allowed_base_shas 为空——该字段必须整体省略（禁编造，实得 %r）" % bs)
              elif bs is not None and bs not in allowed_bs:
                  out.append("base_sha 必须逐字取自输入 allowed_base_shas=%s（实得 %r）" % (allowed_bs, bs))
              for i, c in enumerate(m.get("cards") or []):
                  if not isinstance(c, dict):
                      continue
                  tag = "card[%d]" % i
                  ac = c.get("acceptance")
                  if not isinstance(ac, list) or not ac or not all(
                          isinstance(x, str) and x.strip() for x in ac):
                      out.append("%s acceptance 必须为非空字符串数组" % tag)
                  else:
                      for j, a in enumerate(ac):
                          if not re.search(r"→\s*rc\s*=\s*\d+", a):
                              out.append("M-1: %s acceptance[%d] 缺「→ rc=N」尾标：%r"
                                         % (tag, j, a[:60]))

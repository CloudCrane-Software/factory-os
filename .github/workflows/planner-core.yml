                              manifest = m2
                              print("矫正重试命中：首发 %d 条 M-1 违规已修正" % len(fmt))
                          else:
                              print("矫正重试后仍有 %d 条形制违规——交 step 08 终裁" % len(fmt2))
                  except Exception:
                      print("矫正重试响应非 JSON——保留首发候选交 step 08 终裁")
              except Exception as e:
                  print("矫正重试调用失败 %s——保留首发候选交 step 08 终裁" % type(e).__name__)
          with open("manifest-candidate.json", "w", encoding="utf-8") as f:

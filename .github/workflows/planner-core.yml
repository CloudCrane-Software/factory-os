          print("manifest 候选落盘：cards=%d · attempts=%d（响应内容不进日志/artifact 元数据）"
                % (len(manifest.get("cards") or []), meta["attempts"]))
          PY

      # ── 解析 + 校验：字段逐个数学校验，违者整波作废（不 commit、不建 Issue）──
      - name: '08 · 解析 + 校验 manifest JSON（fail-closed）'
        id: validate
        if: steps.quota.outputs.plan_allowed == 'true'
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import glob, json, os, re, subprocess, sys
          from datetime import datetime, timezone, timedelta

          errors, warnings = [], []
          man = json.load(open("manifest-candidate.json", encoding="utf-8"))
          board = json.load(open("board-state.json", encoding="utf-8"))
          ledger = json.load(open("ledger-summary.json", encoding="utf-8"))

                  txt2 = ((payload2.get("choices") or [{}])[0].get("message") or {}).get("content") or ""
                  txt2 = re.sub(r"^```(?:json)?\s*", "", txt2.strip())
                  txt2 = re.sub(r"\s*```$", "", txt2)
                  try:
                      m2 = json.loads(txt2)
                      if isinstance(m2, dict):
